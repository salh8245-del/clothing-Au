<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b8cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة Au Clothing</title>
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#3b2430;--mute:#8a6b78;--main:#f6b8cc;--acc:#e07a9c;--line:#f0d3dd;--bad:#c0392b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:var(--main);padding:14px 16px;font-size:20px;font-weight:700}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
nav button{flex:1;min-width:92px;padding:12px 8px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#a8325a;border-color:var(--acc);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;background:#fffafc;color:var(--ink);font:inherit;width:100%}
input[readonly]{background:#fdf3f7}
button.go{background:var(--main);color:var(--ink);border:1px solid var(--acc);border-radius:6px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;align-self:end}
button.sm{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.low{color:var(--bad);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--mute)}
.net{border-right:5px solid var(--acc)!important}
.empty{color:var(--mute);padding:8px 0;margin:0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
#productSearchList{display:grid;gap:6px;margin:0 0 8px}
.product-suggestion{padding:8px 10px;border:1px solid var(--line);background:#fffafc;border-radius:8px;cursor:pointer;text-align:right;color:var(--ink);font:inherit;transition:all .15s ease}
.product-suggestion:hover{background:#ffeaf2;border-color:var(--acc);transform:translateY(-1px)}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<header>برنامج محاسبة لمحل Au Clothing</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp(firebaseConfig);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns','suppliers','spay','rates'];
const EMPTY=()=>Object.fromEntries(NAMES.map(k=>[k,[]]));
let uid=null,unsubs=[],loaded=false,tab='products',tab_m='',tab_d='',repMode='day',rmMode='ret',selSup='',selCust='';
let db=EMPTY();
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)}`:'(محذوف)';
const tabs={products:'المنتجات',sale:'بيع',buy:'شراء',rs:'مرتجع / تبديل',sup:'الموردين',exp:'المصاريف',debt:'الديون',rep:'التقارير',acct:'الحساب'};
function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}
function debtValue(total,mode,manualDebt,paid){
  if(mode!=='credit') return {paid:total,debt:0};
  if(manualDebt>0) return {paid:Math.max(0,total-manualDebt),debt:manualDebt};
  const p=Math.min(n(paid),total);
  return {paid:p,debt:Math.max(0,total-p)};
}
function supplierDebtMap(){
  const map={};
  db.purchases.forEach(p=>{
    const due = Number(p.debt)>0 ? Number(p.debt) : Math.max(0, (Number(p.qty)||0)*(Number(p.costUsd)||0) - (Number(p.paid)||0));
    if(!map[p.sid]) map[p.sid]={due:0,pay:0};
    map[p.sid].due += due;
  });
  db.spay.forEach(p=>{ if(!p.sid) return; if(!map[p.sid]) map[p.sid]={due:0,pay:0}; map[p.sid].pay += Number(p.amt)||0; });
  return map;
}
function custData(){
  const C={};
  db.sales.forEach(s=>{
    const name=(s.cust||'').trim();
    if(!name) return;
    const due = Number(s.debt)>0 ? Number(s.debt) : Math.max(0, (Number(s.qty)||0)*(Number(s.price)||0) - (Number(s.paid)||0));
    if(due<=0.005) return;
    if(!C[name]) C[name]={inv:[],pay:0,extraDebt:0};
    C[name].inv.push({...s,due});
  });
  db.pay.forEach(p=>{
    const name=(p.cust||'').trim();
    if(!name) return;
    if(!C[name]) C[name]={inv:[],pay:0,extraDebt:0};
    if(p.kind==='debt') C[name].extraDebt += Number(p.amt)||0;
    else C[name].pay += Number(p.amt)||0;
  });
  Object.keys(C).forEach(name=>{
    const dueTotal = C[name].inv.reduce((a,s)=>a + (Number(s.debt)>0 ? Number(s.debt) : Math.max(0, (Number(s.qty)||0)*(Number(s.price)||0) - (Number(s.paid)||0))),0);
    C[name].rem = dueTotal + (C[name].extraDebt||0) - (C[name].pay||0);
  });
  return C;
}
const supOpts=v=>'<option value="">بدون مورد</option>'+db.suppliers.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${esc(s.name)}</option>`).join('');
const supName=id=>{const s=db.suppliers.find(x=>x.id===id);return s?esc(s.name):'-'};
const productMatches=(text)=>{const q=(text||'').trim().toLowerCase(); if(q.length<2) return []; return db.products.filter(p=>((p.code||'')+' '+(p.name||'')+' '+(p.size||'')+' '+(p.color||'')).toLowerCase().includes(q)).slice(0,8);};
function renderProductSuggestions(form,query){ const list=$('#productSearchList'); if(!list) return; const matches=productMatches(query); if(!matches.length){list.innerHTML='<div class="empty">لا توجد نتائج</div>'; return;} list.innerHTML=matches.map(p=>`<button type="button" class="product-suggestion" data-pid="${p.id}">${esc(p.code)} - ${esc(p.name)} (${p.qty})</button>`).join(''); list.querySelectorAll('.product-suggestion').forEach(btn=>btn.addEventListener('click',()=>{ const p=db.products.find(x=>x.id===btn.dataset.pid); if(!p) return; form.code.value=p.code||''; form.name.value=p.name||''; form.price.value=p.price||''; list.innerHTML=''; })); }
const findP=(c,nm)=>{ const q=(c||'').trim().toLowerCase(); const s=(nm||'').trim().toLowerCase(); const hits=[]; if(q) hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q)); if(s) hits.push(...db.products.filter(p=>((p.name||'')+' '+(p.code||'')+' '+(p.size||'')+' '+(p.color||'')).toLowerCase().includes(s))); return hits.filter((p,i,a)=>a.findIndex(x=>x.id===p.id)===i).length===1 ? hits.filter((p,i,a)=>a.findIndex(x=>x.id===p.id)===i)[0] : null;};
const pinfo=(c,nm)=>{ if(!(c||'').trim()&&!(nm||'').trim()) return ''; const q=(c||'').trim().toLowerCase(); const s=(nm||'').trim().toLowerCase(); const hits=[]; if(q) hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q)); if(s) hits.push(...db.products.filter(p=>((p.name||'')+' '+(p.code||'')+' '+(p.size||'')+' '+(p.color||'')).toLowerCase().includes(s))); if(!hits.length) return 'لا يوجد منتج مطابق'; return hits.length===1 ? `✓ ${pname(hits[0])} | المتوفر: ${hits[0].qty}` : `نتائج متعددة: ${hits.slice(0,5).map(p=>`${esc(p.name)} (${esc(p.code)})`).join(' | ')}`; };
const curRate=()=>{const r=db.rates.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):0};
const pc=p=>p.costUsd?p.costUsd*curRate():n(p.cost);
const banner=()=>{const ok=db.rates.some(x=>x.date===today()),r=curRate();return `<div class="card"><form onsubmit="setRate(event)"><label>${ok?'سعر صرف اليوم':'أدخل سعر صرف اليوم'}<input name="r" type="number" step="any" min="0" value="${r||''}" required></label><button class="go">حفظ</button></form></div>`};
function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">جارٍ تحميل البيانات...</div>';
  $('#app').innerHTML=banner()+views[tab]();
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;
  if(u){uid=u.uid;let got=0;NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),s=>{ db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0)); if(++got>=NAMES.length){loaded=true;render();}} ,e=>toast('خطأ في القراءة: '+e.code))));}
  else{uid=null;db=EMPTY();}
  render();
});
const views={
  login(){return `<div class="card"><h3>تسجيل الدخول</h3><form onsubmit="login(event)"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input name="pw" type="password" required autocomplete="current-password"></label><button class="go">دخول</button></form></div>`;},
  products(){
    const rows=db.products.map(p=>{const c=pc(p); return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${supName(p.supId)}</td><td>${p.costUsd?fmt(p.costUsd):''}</td><td>${fmt(c)}</td><td>${p.qty}</td><td>${fmt(p.price)}</td><td><button class="sm" onclick="setCode('${p.id}')">تعديل الكود</button> <button class="sm" onclick="delP('${p.id}')">حذف</button></td></tr>`;}).reverse();
    return `<div class="card"><h3>إضافة منتج</h3><form onsubmit="addP(event)"><label>الكود<input name="code" required></label><label>اسم المنتج<input name="name" required></label><label>المقاس<input name="size"></label><label>اللون<input name="color"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>سعر القطعة بالدولار $<input name="usd" type="number" step="any" min="0"></label><label>أو إجمالي الفاتورة بالدولار $<input name="tot" type="number" step="any" min="0"></label><label>سعر البيع بالسوري<input name="price" type="number" step="any" min="0" required></label><label>الكمية<input name="qty" type="number" min="1" value="1"></label><label>طريقة الدفع<select name="mode"><option value="cash">كاش</option><option value="credit">دين</option></select></label><label>المدفوع الآن بالدولار<input name="paid" type="number" step="any" min="0"></label><label>الدين على المورد (إن وجد)<input name="debt" type="number" step="any" min="0"></label><button class="go">إضافة المنتج</button></form></div><div class="card"><h3>المخزون (${db.products.length})</h3>${table(['الكود','الاسم','المقاس','اللون','المورد','شراء $','التكلفة ل.س (اليوم)','الكمية','سعر البيع',''],rows,'لا توجد منتجات بعد.')}</div>`;
  },
  sale(){
    const rows=db.sales.slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td>${pname(prod(s.pid))}${s.swap?' (تبديل)':''}</td><td>${s.qty}</td><td>${fmt(s.qty*s.price)}</td><td>${esc(s.cust||'')}</td><td>${fmt(s.paid)}</td><td>${fmt(Number(s.debt)||0)}</td></tr>`);
    return `<div class="card"><h3>فاتورة بيع</h3><form onsubmit="addS(event)" oninput="slCalc(this,event)"><label>بحث المنتج<input name="search" autocomplete="off" placeholder="اكتب اسم أو كود المنتج"></label><div id="productSearchList"></div><label>كود المنتج<input name="code" autocomplete="off"></label><label>اسم المنتج<input name="name" autocomplete="off" readonly></label><label>الكمية<input name="qty" type="number" min="1" value="1" required></label><label>سعر القطعة<input name="price" type="number" step="any" min="0" required></label><label>طريقة الدفع<select name="mode"><option value="cash">نقداً</option><option value="credit">دين</option></select></label><label>اسم الزبون<input name="cust"></label><label>المدفوع الآن<input name="paid" type="number" step="any" min="0"></label><label>الدين على الزبون (إن وجد)<input name="debt" type="number" step="any" min="0"></label><button class="go">تسجيل البيع</button><p id="pinfo" class="empty"></p></form></div><div class="card"><h3>آخر المبيعات</h3>${table(['التاريخ','المنتج','الكمية','الإجمالي','الزبون','المدفوع','الدين'],rows,'لا توجد مبيعات بعد.')}</div>`;
  },
  buy(){
    const rows=db.purchases.filter(p=>p.sid!==undefined).slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td>${pname(prod(s.pid))}</td><td>${supName(s.sid)}</td><td>${s.qty}</td><td>${fmt(s.costUsd)}</td><td>${fmt(s.qty*s.costUsd)}</td><td>${fmt(s.paid)}</td><td>${fmt(Number(s.debt)||0)}</td></tr>`);
    return `<div class="card"><h3>فاتورة شراء</h3><form onsubmit="addB(event)" oninput="byCalc(this,event)"><label>كود المنتج<input name="code" autocomplete="off"></label><label>أو اسم المنتج<input name="nm" autocomplete="off"></label><label>الكمية<input name="qty" type="number" min="1" value="1" required></label><label>سعر القطعة بالدولار $<input name="usd" type="number" step="any" min="0"></label><label>أو إجمالي الفاتورة بالدولار $<input name="tot" type="number" step="any" min="0"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>طريقة الدفع<select name="mode"><option value="cash">كاش</option><option value="credit">دين</option></select></label><label>المدفوع الآن بالدولار<input name="paid" type="number" step="any" min="0"></label><label>الدين على المورد (إن وجد)<input name="debt" type="number" step="any" min="0"></label><button class="go">تسجيل الشراء</button><p id="pinfo" class="empty"></p></form></div><div class="card"><h3>آخر المشتريات</h3>${table(['التاريخ','المنتج','المورد','الكمية','سعر $','الإجمالي $','المدفوع $','الدين'],rows,'لا توجد مشتريات بعد.')}</div>`;
  },
  rs(){ return `<div class="card"><h3>المرتجع والتبديل</h3><p class="empty">سيتم تفعيل هذه الصفحة لاحقاً إذا رغبت.</p></div>`; },
  sup(){
    const debtMap=supplierDebtMap();
    const rows=db.suppliers.map(s=>{ const d=(debtMap[s.id]?.due||0) - (debtMap[s.id]?.pay||0); return `<tr><td>${esc(s.name)}</td><td class="${d>0.005?'low':''}">${fmt(d)} $</td><td><button class="sm" onclick="paySup('${s.id}')">دفع</button></td></tr>`; });
    let det='';
    if(selSup){
      const sp=db.suppliers.find(x=>x.id===selSup);
      if(sp){
        const d=(debtMap[sp.id]?.due||0) - (debtMap[sp.id]?.pay||0);
        const invs=db.purchases.filter(p=>p.sid===sp.id).slice(-20).reverse().map(p=>`<tr><td>${p.date}</td><td>${pname(prod(p.pid))}</td><td>${p.qty}</td><td>${fmt(Number(p.debt)||0)}</td><td>${fmt(Number(p.paid)||0)}</td></tr>`);
        const pays=db.spay.filter(x=>x.sid===sp.id).slice(-15).reverse().map(x=>`<tr><td>${x.date}</td><td>${fmt(Number(x.amt)||0)} $</td></tr>`);
        det=`<div class="card"><h3>${esc(sp.name)} — الدين: ${fmt(d)} $</h3>${table(['التاريخ','المنتج','الكمية','الدين','المدفوع'],invs,'')}</div><div class="card"><h3>دفعات المورد</h3>${table(['التاريخ','المبلغ'],pays,'')}</div>`;
      }
    }
    return `<div class="card"><h3>إضافة مورد</h3><form onsubmit="addSup(event)"><label>اسم المورد<input name="name" required></label><button class="go">إضافة</button></form></div><div class="card"><h3>الموردون (الدين بالدولار)</h3>${table(['المورد','الدين عليّ',''],rows,'لا يوجد موردون ب��د.')}</div>${det}`;
  },
  exp(){
    const rows=db.expenses.slice(-30).reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.desc)}</td><td>${fmt(e.amt)}</td><td><button class="sm" onclick="delE('${e.id}')">حذف</button></td></tr>`);
    return `<div class="card"><h3>تسجيل مصروف</h3><form onsubmit="addE(event)"><label>التاريخ<input name="date" type="date" value="${today()}"></label><label>البند (إيجار، كهرباء، راتب...)<input name="desc" required></label><label>المبلغ بالسوري<input name="amt" type="number" step="any" min="0" required></label><button class="go">حفظ المصروف</button></form></div><div class="card"><h3>آخر المصاريف</h3>${table(['التاريخ','البند','المبلغ',''],rows,'لا توجد مصاريف بعد.')}</div>`;
  },
  debt(){
    const C=custData();
    const names=Object.keys(C).filter(c=>C[c].rem>0.005);
    const rows=names.map(c=>`<tr><td>${esc(c)}</td><td class="low">${fmt(C[c].rem)}</td><td><button class="sm" onclick="setCust(${JSON.stringify(c).replace(/"/g,'&quot;')})">تفاصيل</button></td></tr>`);
    let det='';
    const cd=C[selCust];
    if(cd){
      const payRows=db.pay.filter(p=>p.cust===selCust).slice(-15).reverse().map(p=>`<tr><td>${p.date}</td><td>${fmt(Number(p.amt)||0)}</td><td>${p.kind==='debt'?'دين إضافي':'دفعة'}</td></tr>`);
      const invRows=cd.inv.slice(-20).reverse().map(i=>`<tr><td>${i.date}</td><td>${pname(prod(i.pid))}</td><td>${fmt(Number(i.qty||0) * Number(i.price||0))}</td><td>${fmt(Number(i.debt)>0 ? Number(i.debt) : Math.max(0, (Number(i.qty)||0)*(Number(i.price)||0) - (Number(i.paid)||0))}</td></tr>`);
      det=`<div class="card"><h3>${esc(selCust)} — المتبقي: ${fmt(cd.rem)}</h3>${table(['تاريخ الفاتورة','المنتج','القيمة','الدين'],invRows,'')}</div><div class="card"><h3>سجل المدفوعات / الدين</h3>${table(['التاريخ','المبلغ','نوع الحركة'],payRows,'')}</div>`;
    }
    return `<div class="card"><h3>ديون الزبائن (ل.س)</h3>${table(['الزبون','المتبقي',''],rows,'لا توجد ديون.')}</div><div class="card"><h3>إضافة دين يدوي</h3><form onsubmit="addCustDebt(event)"><label>اسم الزبون<input name="cust" required></label><label>المبلغ بالدين<input name="amt" type="number" step="any" min="0" required></label><button class="go">حفظ الدين</button></form></div>${det}`;
  },
  rep(){ return `<div class="card"><h3>التقارير</h3><p class="empty">قريباً</p></div>`; },
  acct(){ return `<div class="card"><h3>الحساب</h3><p>البيانات تُخزن في Firebase وتدعم العمل بدون إنترنت.</p></div>`;}
};
const fail=x=>toast('تعذّر الحفظ: '+x.code);
const act={
  go(k){tab=k;render();},
  setRate(e){e.preventDefault(); const b=writeBatch(fs); put(b,'rates',{date:today(),rate:n(e.target.elements.r.value)}); b.commit().catch(fail); toast('تم حفظ سعر الصرف'); },
  login(e){e.preventDefault(); const f=e.target.elements; signInWithEmailAndPassword(auth,f.email.value.trim(),f.pw.value).catch(()=>toast('بيانات الدخول غير صحيحة أو لا يوجد حساب')); },
  out(){signOut(auth);},
  addP(e){
    e.preventDefault();
    const f=e.target.elements;
    const code=(f.code.value||'').trim();
    const q=Math.max(0,Math.floor(n(f.qty.value)));
    const tot=n(f.tot.value);
    const unit=n(f.usd.value);
    const sid=f.sid.value;
    const total = tot>0 ? tot : (unit>0 ? unit*q : 0);
    if(!code) return toast('اكتب كود المنتج');
    if(!f.name.value.trim()) return toast('اكتب اسم المنتج');
    if(q<1) return toast('الكمية يجب أن تكون أكثر من صفر');
    if(!(total>0)) return toast('اكتب سعر القطعة بالدولار، أو إجمالي الفاتورة');
    if(db.products.some(p=>(p.code||'').toLowerCase()===code.toLowerCase())) return toast('هذا الكود مستخدم لمنتج آخر');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid;
    const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const unitPrice = unit>0 ? unit : (q>0 ? total/q : 0);
    const b=writeBatch(fs); const pr=doc(C('products'));
    b.set(pr,{code,name:f.name.value.trim(),size:f.size.value.trim(),color:f.color.value.trim(),supId:sid,costUsd:unitPrice,price:n(f.price.value),qty:q,ts:Date.now()});
    if(q>0) put(b,'purchases',{date:today(),pid:pr.id,sid,qty:q,costUsd:unitPrice,paid,debt});
    b.commit().catch(fail); toast(debt>0.005?'تمت الإضافة. الدين على المورد: '+fmt(debt)+' $':'تمت إضافة المنتج'); e.target.reset();
  },
  setCode(id){ const c=(prompt('الكود الجديد')||'').trim(); if(!c) return; if(db.products.some(p=>(p.code||'').toLowerCase()===c.toLowerCase())) return toast('الكود مستخدم'); const b=writeBatch(fs); b.update(D('products',id),{code:c}); b.commit().catch(fail); toast('تم تحديث الكود'); },
  delP(id){ const p=prod(id); if(!confirm('حذف '+p.name+'؟')) return; const b=writeBatch(fs); b.delete(D('products',id)); b.commit(); },
  addS(e){
    e.preventDefault();
    const f=e.target.elements;
    const p=findP(f.code.value,f.name.value);
    if(!p) return toast('المنتج غير موجود أو غير محدد');
    const q=Math.max(0,Math.floor(n(f.qty.value))); const price=n(f.price.value); const total=q*price; const cust=(f.cust.value||'').trim();
    if(q<1) return toast('الكمية يجب أن تكون أكثر من صفر');
    if(q>p.qty) return toast('الكمية المتوفرة '+p.qty+' فقط');
    if(f.mode.value==='credit'&&!cust) return toast('اكتب اسم الزبون لتسجيل الدين');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid;
    const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const b=writeBatch(fs); b.update(D('products',p.id),{qty:increment(-q)}); put(b,'sales',{date:today(),pid:p.id,qty:q,price:price,list:p.price,cost:pc(p),cust,paid,debt}); b.commit().catch(fail); toast(debt>0.005?'تم البيع. دين على '+cust+': '+fmt(debt):'تم البيع: '+fmt(total)); e.target.reset(); $('#pinfo').innerHTML='';
  },
  addB(e){
    e.preventDefault();
    const f=e.target.elements; const p=findP(f.code.value,f.nm.value); if(!p) return toast('المنتج غير موجود أو غير محدد');
    const q=Math.max(0,Math.floor(n(f.qty.value))); const total = n(f.tot.value)>0 ? n(f.tot.value) : q*n(f.usd.value); const sid=f.sid.value;
    if(q<1||!(total>0)) return toast('اكتب سعر القطعة أو إجمالي الفاتورة');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid; const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    if(debt>0.005&&!sid) return toast('اختر المورد لتسجيل الدين');
    const b=writeBatch(fs); b.update(D('products',p.id),{qty:increment(q),costUsd:q>0?total/q:0}); put(b,'purchases',{date:today(),pid:p.id,sid,qty:q,costUsd:q>0?total/q:0,paid,debt}); b.commit().catch(fail); toast(debt>0.005?'تم الشراء. الدين على المورد: '+fmt(debt)+' $':'تم الشراء'); e.target.reset(); $('#pinfo').innerHTML='';
  },
  addSup(e){ e.preventDefault(); const b=writeBatch(fs); put(b,'suppliers',{name:e.target.elements.name.value.trim()}); b.commit().catch(fail); toast('تمت إضافة المورد'); e.target.reset(); },
  paySup(id){ const v=n(prompt('مبلغ الدفعة بالدولار')); if(v<=0) return; const b=writeBatch(fs); put(b,'spay',{date:today(),sid:id,amt:v}); b.commit(); toast('تم تسجيل الدفع'); },
  setCust(c){selCust=c; render();},
  addCustDebt(e){ e.preventDefault(); const f=e.target.elements; const cust=(f.cust.value||'').trim(); const amt=n(f.amt.value); if(!cust||amt<=0) return toast('اكتب اسم الزبون ومبلغ الدين'); const b=writeBatch(fs); put(b,'pay',{date:today(),cust,amt,kind:'debt'}); b.commit().catch(fail); toast('تمت إضافة الدين للزبون'); e.target.reset(); render(); },
  addE(e){ e.preventDefault(); const f=e.target.elements; const b=writeBatch(fs); put(b,'expenses',{date:f.date.value||today(),desc:f.desc.value.trim(),amt:n(f.amt.value)}); b.commit().catch(fail); toast('تم حفظ المصروف'); e.target.reset(); },
  delE(id){ if(!confirm('حذف هذا المصروف؟')) return; const b=writeBatch(fs); b.delete(D('expenses',id)); b.commit(); },
  slCalc(f,e){
    const q=(f.search&&f.search.value||'').trim();
    if(f.search && e.target && e.target.name==='search') renderProductSuggestions(f, q);
    const p=findP(f.code.value, (f.name&&f.name.value) || (f.search&&f.search.value) || '');
    if(p){ f.name.value=p.name; f.code.value=p.code; f.price.value=p.price; }
    const text = pinfo(f.code.value, (f.name&&f.name.value) || (f.search&&f.search.value) || '');
    $('#pinfo').innerHTML=text;
  },
  byCalc(f,e){ const p=findP(f.code.value,f.nm.value); if(p){ f.usd.value = p.costUsd || ''; } $('#pinfo').innerHTML=pinfo(f.code.value,f.nm.value); },
  setRm(v){rmMode=v; render();},
  setRep(v){repMode=v; render();},
  setSup(v){selSup=v; render();},
  exportJ(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download='backup-'+today()+'.json'; a.click(); }
};
Object.assign(window,act);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
