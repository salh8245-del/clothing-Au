<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b8cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة Au Clothing</title>
<style>
  :root{
    --bg:#f6f1f5;
    --bg-soft:#fff7fa;
    --panel:#ffffff;
    --panel-alt:#fffafc;
    --ink:#241922;
    --muted:#745c69;
    --main:#f6b8cc;
    --main-2:#f3d9e5;
    --acc:#d96d95;
    --acc-2:#b84f7b;
    --line:#f1dfe8;
    --bad:#d94b52;
    --good:#1e8d6c;
    --shadow:0 24px 55px rgba(153, 89, 120, 0.12);
    --shadow-soft:0 10px 28px rgba(163, 99, 130, 0.09);
    --radius:24px;
    --radius-sm:16px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(circle at top right, rgba(217,109,149,.12), transparent 26%),
      radial-gradient(circle at top left, rgba(195, 154, 207, .10), transparent 24%),
      linear-gradient(180deg, #f8f3f6 0%, #f3edf1 100%);
    color:var(--ink);
    font:16px/1.7 Tahoma,"Segoe UI",Arial,sans-serif;
    min-height:100vh;
  }

  .app-shell{
    max-width:1320px;
    margin:0 auto;
    padding:22px 18px 38px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    background:linear-gradient(135deg, rgba(255,255,255,.94), rgba(255,247,250,.9));
    border:1px solid rgba(217,109,149,.14);
    border-radius:30px;
    padding:18px 22px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
    position:sticky;
    top:10px;
    z-index:20;
  }

  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:54px;height:54px;border-radius:18px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);
    color:#fff;font-weight:900;font-size:1.4rem;
    box-shadow:0 16px 26px rgba(184,79,123,.24);
    position:relative;overflow:hidden;
  }
  .brand-mark::before{
    content:"";
    position:absolute;
    inset:-35% auto auto -20%;
    width:60%;height:180%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    transform:rotate(18deg);
  }
  .brand h1{margin:0; font-size:1.42rem; color:var(--ink); letter-spacing:.2px}
  .brand small{display:block; color:var(--muted); font-size:.74rem; margin-top:2px}

  .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{
    border:none;border-radius:14px;padding:11px 18px;
    background:#fff3f7;border:1px solid rgba(217,109,149,.15);
    color:var(--acc-2);font:inherit;font-weight:800;cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }
  .pill:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(196,75,123,.08);background:#fff8fb}
  .pill.primary{
    background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);
    color:#fff;border-color:transparent;box-shadow:0 14px 24px rgba(184,79,123,.2);
  }

  nav{
    display:flex;gap:10px;overflow-x:auto;
    padding:8px 8px 18px;margin:0 0 18px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:1 0 auto;min-width:120px;
    padding:13px 16px;border:1px solid rgba(217,109,149,.12);
    border-radius:16px;background:rgba(255,255,255,.72);
    color:var(--muted);font:inherit;font-weight:800;
    cursor:pointer;white-space:nowrap;transition:all .18s ease;
  }
  nav button:hover{background:#fff7fa;color:var(--acc-2);transform:translateY(-1px)}
  nav button.on{
    background:linear-gradient(180deg, rgba(246,184,204,.18), rgba(255,255,255,.9));
    color:var(--acc-2);border-color:rgba(217,109,149,.22);
    box-shadow: inset 0 0 0 1px rgba(217,109,149,.06), 0 12px 20px rgba(184,79,123,.05);
  }

  main{display:grid;gap:18px}
  .card{
    background:var(--panel);border:1px solid rgba(217,109,149,.12);
    border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-soft);
  }
  .card h3, .card h4{margin:0 0 14px;color:var(--ink)}
  .hero{
    display:grid;grid-template-columns:1.25fr .75fr;gap:18px;padding:0;
    overflow:hidden;
  }
  .hero-card{
    position:relative;
    background:linear-gradient(135deg, #ffffff 0%, #fff7fa 100%);
    border:1px solid rgba(217,109,149,.12);
    border-radius:26px;padding:24px;box-shadow:var(--shadow-soft);
    overflow:hidden;
  }
  .hero-card::before{
    content:"";
    position:absolute;inset:0 auto 0 0;
    width:120px;
    background:linear-gradient(180deg, rgba(217,109,149,.12), rgba(217,109,149,0));
  }
  .hero-card h3{margin:0 0 10px;font-size:1.2rem; position:relative; z-index:1}
  .hero-card p{margin:0;color:var(--muted);line-height:1.9;font-size:.96rem; position:relative; z-index:1}

  .kpi{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-top:18px;position:relative;z-index:1}
  .kpi div{
    background:linear-gradient(180deg,#fff 0%,#fff8fb 100%);
    border:1px solid rgba(217,109,149,.12);border-radius:18px;padding:16px 14px;
    box-shadow:0 12px 20px rgba(196,75,123,.04);
  }
  .kpi b{display:block;font-size:1.55rem;color:var(--acc-2);margin-bottom:5px;line-height:1.2}
  .kpi span{font-size:.75rem;color:var(--muted)}

  .rate-box{
    background:linear-gradient(135deg, rgba(217,109,149,.14), rgba(124,79,141,.08));
    border:1px solid rgba(217,109,149,.14);border-radius:26px;padding:22px;
    display:flex;flex-direction:column;justify-content:center;gap:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  }
  .rate-box .label{color:var(--muted);font-size:.8rem}
  .rate-box .value{font-size:2rem;font-weight:900;color:var(--acc-2);line-height:1.2}

  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.8rem;font-weight:700}
  input,select{
    width:100%;padding:12px 14px;border:1px solid rgba(217,109,149,.18);background:#fffafc;
    border-radius:12px;color:var(--ink);font:inherit;transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input::placeholder{color:#a88a96}
  input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(217,109,149,.10);outline:none;background:#fff}
  button.go{
    align-self:end;border:none;border-radius:12px;padding:12px 18px;
    background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);
    color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 16px 28px rgba(184,79,123,.22);
    min-height:48px;transition:transform .18s ease, box-shadow .18s ease;
  }
  button.go:hover{transform:translateY(-1px);box-shadow:0 18px 32px rgba(184,79,123,.24)}
  button.sm{padding:8px 12px;border-radius:10px;border:1px solid rgba(217,109,149,.18);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s ease}
  button.sm:hover{background:#fff1f7;border-color:var(--acc);color:var(--acc-2)}

  .tw{overflow-x:auto;border:1px solid rgba(217,109,149,.12);border-radius:18px;background:linear-gradient(180deg,#fff,#fffafc);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  table{width:100%;border-collapse:collapse;min-width:700px}
  th,td{padding:14px 12px;border-bottom:1px solid rgba(217,109,149,.12);text-align:right;white-space:nowrap}
  th{background:#fff4f9;color:var(--muted);font-weight:800;font-size:.78rem}
  tbody tr{transition:background .15s ease}
  tbody tr:hover{background:rgba(217,109,149,.03)}
  .low{color:var(--bad);font-weight:800}
  .empty{color:var(--muted);padding:10px 0;margin:0}
  #msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(36,25,34,.94);color:#fff;padding:12px 18px;border-radius:14px;font-size:.88rem;display:none;box-shadow:0 18px 30px rgba(36,25,34,.18);z-index:50;border:1px solid rgba(255,255,255,.08)}

  #productSearchList{display:grid;gap:8px;margin:0 0 8px}
  .product-suggestion{background:#fffafc;border:1px solid rgba(217,109,149,.12);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:right;color:var(--ink);transition:all .18s ease}
  .product-suggestion:hover{background:#fff1f7;border-color:rgba(217,109,149,.3);transform:translateY(-1px)}

  :focus-visible{outline:3px solid rgba(217,109,149,.28);outline-offset:2px}

  @media (max-width:860px){
    .hero{grid-template-columns:1fr}
    .kpi{grid-template-columns:repeat(2,minmax(120px,1fr))}
    .topbar{flex-direction:column;align-items:flex-start}
    .top-actions{width:100%}
    .top-actions .pill{flex:1}
  }

  @media (max-width:540px){
    .app-shell{padding:12px 12px 28px}
    .card{padding:16px}
    .kpi{grid-template-columns:1fr}
    nav button{min-width:94px;padding:11px 12px}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>Au Clothing</h1>
        <small>نظام إدارة المبيعات والمخزون</small>
      </div>
    </div>
    <div class="top-actions">
      <button class="pill">التقارير</button>
      <button class="pill primary">إضافة منتج</button>
    </div>
  </header>

  <nav id="nav"></nav>
  <main id="app"></main>
</div>
<div id="msg" role="status"></div>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp(firebaseConfig);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns','suppliers','spay','rates'];
const EMPTY=()=>Object.fromEntries(NAMES.map(k=>[k,[]]));
let uid=null,unsubs=[],loaded=false,tab='products',tab_m='',tab_d='',repMode='day',rmMode='ret',selSup='',selCust='';
let db=EMPTY();
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)}`:'(محذوف)';
const tabs={products:'المنتجات',sale:'بيع',buy:'شراء',rs:'مرتجع / تبديل',sup:'الموردين',exp:'المصاريف',debt:'الديون',rep:'التقارير',acct:'الحساب'};
function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}
function debtValue(total,mode,manualDebt,paid){
  if(mode!=='credit') return {paid:total,debt:0};
  if(manualDebt>0) return {paid:Math.max(0,total-manualDebt),debt:manualDebt};
  const p=Math.min(n(paid),total);
  return {paid:p,debt:Math.max(0,total-p)};
}
function supplierDebtMap(){
  const map={};
  db.purchases.forEach(p=>{
    const due = Number(p.debt)>0 ? Number(p.debt) : Math.max(0, (Number(p.qty)||0)*(Number(p.costUsd)||0) - (Number(p.paid)||0));
    if(!map[p.sid]) map[p.sid]={due:0,pay:0};
    map[p.sid].due += due;
  });
  db.spay.forEach(p=>{ if(!p.sid) return; if(!map[p.sid]) map[p.sid]={due:0,pay:0}; map[p.sid].pay += Number(p.amt)||0; });
  return map;
}
function custData(){
  const C={};
  db.sales.forEach(s=>{
    const name=(s.cust||'').trim();
    if(!name) return;
    const due = Number(s.debt)>0 ? Number(s.debt) : Math.max(0, (Number(s.qty)||0)*(Number(s.price)||0) - (Number(s.paid)||0));
    if(due<=0.005) return;
    if(!C[name]) C[name]={inv:[],pay:0,extraDebt:0};
    C[name].inv.push({...s,due});
  });
  db.pay.forEach(p=>{
    const name=(p.cust||'').trim();
    if(!name) return;
    if(!C[name]) C[name]={inv:[],pay:0,extraDebt:0};
    if(p.kind==='debt') C[name].extraDebt += Number(p.amt)||0;
    else C[name].pay += Number(p.amt)||0;
  });
  Object.keys(C).forEach(name=>{
    const dueTotal = C[name].inv.reduce((a,s)=>a + (Number(s.debt)>0 ? Number(s.debt) : Math.max(0, (Number(s.qty)||0)*(Number(s.price)||0) - (Number(s.paid)||0))),0);
    C[name].rem = dueTotal + (C[name].extraDebt||0) - (C[name].pay||0);
  });
  return C;
}
const supOpts=v=>'<option value="">بدون مورد</option>'+db.suppliers.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${esc(s.name)}</option>`).join('');
const supName=id=>{const s=db.suppliers.find(x=>x.id===id);return s?esc(s.name):'-'};
const productMatches=(text)=>{const q=(text||'').trim().toLowerCase(); if(q.length<2) return []; return db.products.filter(p=>((p.code||'')+' '+(p.name||'')+' '+(p.size||'')+' '+(p.color||'')).toLowerCase().includes(q)).slice(0,6)};
function renderProductSuggestions(form,query){ const list=$('#productSearchList'); if(!list) return; const matches=productMatches(query); if(!matches.length){list.innerHTML='<div class="empty">لا توجد منتجات مطابقة.</div>'; return;} list.innerHTML=matches.map(p=>`<div class="product-suggestion" onclick="fillProductFromSuggestion('${p.id}')">${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)} (${esc(p.code)})</div>`).join(''); }
const findP=(c,nm)=>{ const q=(c||'').trim().toLowerCase(); const s=(nm||'').trim().toLowerCase(); const hits=[]; if(q) hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q)); if(s) hits.push(...db.products.filter(p=>((p.name||'').toLowerCase()===s)||(p.code||'').toLowerCase()===s)); return hits[0]||null; };
const pinfo=(c,nm)=>{ if(!(c||'').trim()&&!(nm||'').trim()) return ''; const q=(c||'').trim().toLowerCase(); const s=(nm||'').trim().toLowerCase(); const hits=[]; if(q) hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q)); if(s) hits.push(...db.products.filter(p=>((p.name||'').toLowerCase()===s)||(p.code||'').toLowerCase()===s)); if(!hits.length) return '<div class="empty">لا يوجد منتج مطابق.</div>'; const uniq=[...new Map(hits.map(p=>[p.id,p])).values()].slice(0,5); return `<div id="productSearchList">${uniq.map(p=>`<div class="product-suggestion" onclick="fillProductFromSuggestion('${p.id}')">${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)} (${esc(p.code)})</div>`).join('')}</div>`; };
const curRate=()=>{const r=db.rates.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):0};
const pc=p=>p.costUsd?p.costUsd*curRate():n(p.cost);
const banner=()=>{const ok=db.rates.some(x=>x.date===today()),r=curRate();return `<div class="card hero"><div class="hero-card"><h3>لوحة التحكم</h3><p>إدارة المخزون، المبيعات، الموردين والديون من شاشة واحدة. التزامك بالتفاصيل اليومي يضمن نمو أعمالك بثقة.</p><div class="kpi"><div><b>${fmt(db.products.reduce((a,p)=>a+(n(p.qty)||0),0))}</b><span>إجمالي المخزون</span></div><div><b>${fmt(db.sales.reduce((a,s)=>a+(n(s.qty)||0),0))}</b><span>عدد المبيعات</span></div><div><b>${fmt(db.purchases.reduce((a,p)=>a+(n(p.qty)||0),0))}</b><span>المشتريات</span></div><div><b>${fmt(r||0)}</b><span>سعر صرف ${ok?'اليوم':'آخر تحديث'}</span></div></div></div><div class="rate-box"><div class="label">سعر الصرف الحالي</div><div class="value">${fmt(r||0)} $</div><button class="go" onclick="setRateFromButton()">تحديث السعر</button></div></div>`;};
function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">جارٍ تحميل البيانات...</div>';
  $('#app').innerHTML=banner()+views[tab]();
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;
  if(u){uid=u.uid;let got=0;NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),s=>{ db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0)); if(++got>=NAMES.length){loaded=true;render();}})))}
  else{uid=null;db=EMPTY();render();}
});
const views={
  login(){return `<div class="card"><h3>تسجيل الدخول</h3><form onsubmit="login(event)"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input name="pw" type="password" required autocomplete="current-password"></label><button class="go">دخول</button></form></div>`;},
  products(){
    const rows=db.products.map(p=>{const c=pc(p); return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${supName(p.supId)}</td><td>${fmt(c)} $</td><td>${fmt(p.qty)}</td><td>${fmt(p.price)} $</td><td><button class="sm" onclick="upP('${p.id}')">تعديل</button> <button class="sm" onclick="delP('${p.id}')">حذف</button></td></tr>`;});
    return `<div class="card"><h3>إضافة منتج</h3><form onsubmit="addP(event)"><label>الكود<input name="code" required></label><label>اسم المنتج<input name="name" required></label><label>المقاس<input name="size"></label><label>اللون<input name="color"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>الكمية<input name="qty" type="number" min="1" required></label><label>السعر بالدولار/وحدة<input name="usd" type="number" step="0.01"></label><label>إجمالي الفاتورة<input name="tot" type="number" step="0.01"></label><label>سعر البيع<input name="price" type="number" step="0.01"></label><label>الدفع نقداً<input name="paid" type="number" step="0.01" value="0"></label><label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>الدين المقدر<input name="debt" type="number" step="0.01" value="0"></label><button class="go">حفظ المنتج</button></form></div><div class="card"><h3>قائمة المنتجات</h3>${table(['الكود','الاسم','المقاس','اللون','المورد','التكلفة','الكمية','سعر البيع',''],rows,'لا توجد منتجات.')}</div>`;
  },
  sale(){
    const rows=db.sales.slice(-20).reverse().map(s=>`<tr><td>${s.date}</td><td>${pname(prod(s.pid))}${s.swap?' (تبديل)':''}</td><td>${esc(s.cust||'-')}</td><td>${s.qty}</td><td>${fmt(s.qty*s.price)}</td><td>${fmt(s.paid||0)}</td><td>${fmt(s.debt||0)}</td></tr>`);
    return `<div class="card"><h3>فاتورة بيع</h3><form onsubmit="addS(event)" oninput="slCalc(this,event)"><label>بحث المنتج أو الكود<input name="search" autocomplete="off"></label><label>الكود<input name="code" autocomplete="off"></label><label>اسم المنتج<input name="name" autocomplete="off"></label><label>الكمية<input name="qty" type="number" min="1" required></label><label>سعر الوحدة<input name="price" type="number" step="0.01" required></label><label>اسم الزبون<input name="cust" autocomplete="off"></label><label>الدفع نقداً<input name="paid" type="number" step="0.01" value="0"></label><label>النوع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>الدين المقدر<input name="debt" type="number" step="0.01" value="0"></label><div id="pinfo"></div><button class="go">إضافة بيع</button></form></div><div class="card"><h3>آخر المبيعات</h3>${table(['التاريخ','المنتج','الزبون','الكمية','الإجمالي','المدفوع','الدين'],rows,'لا توجد مبيعات.')}</div>`;
  },
  buy(){
    const rows=db.purchases.filter(p=>p.sid!==undefined).slice(-20).reverse().map(s=>`<tr><td>${s.date}</td><td>${pname(prod(s.pid))}</td><td>${supName(s.sid)}</td><td>${s.qty}</td><td>${fmt(Number(s.costUsd)||0)}</td><td>${fmt(Number(s.paid)||0)}</td><td>${fmt(Number(s.debt)||0)}</td></tr>`);
    return `<div class="card"><h3>فاتورة شراء</h3><form onsubmit="addB(event)" oninput="byCalc(this,event)"><label>الكود<input name="code" autocomplete="off"></label><label>اسم المنتج<input name="nm" autocomplete="off"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>الكمية<input name="qty" type="number" min="1" required></label><label>إجمالي الفاتورة<input name="tot" type="number" step="0.01"></label><label>السعر بالدولار/وحدة<input name="usd" type="number" step="0.01"></label><label>الدفع نقداً<input name="paid" type="number" step="0.01" value="0"></label><label>النوع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>الدين المقدر<input name="debt" type="number" step="0.01" value="0"></label><div id="pinfo"></div><button class="go">إضافة شراء</button></form></div><div class="card"><h3>آخر المشتريات</h3>${table(['التاريخ','المنتج','المورد','الكمية','التكلفة','المدفوع','الدين'],rows,'لا توجد مشتريات.')}</div>`;
  },
  rs(){ return `<div class="card"><h3>المرتجع والتبديل</h3><p class="empty">سيتم تفعيل هذه الصفحة لاحقاً إذا رغبت.</p></div>`; },
  sup(){
    const debtMap=supplierDebtMap();
    const rows=db.suppliers.map(s=>{ const d=(debtMap[s.id]?.due||0) - (debtMap[s.id]?.pay||0); return `<tr><td>${esc(s.name)}</td><td class="${d>0.005?'low':''}">${fmt(d)} $</td><td><button class="sm" onclick="setSup('${s.id}')">تفاصيل</button></td></tr>`;});
    let det='';
    if(selSup){
      const sp=db.suppliers.find(x=>x.id===selSup);
      if(sp){
        const d=(debtMap[sp.id]?.due||0) - (debtMap[sp.id]?.pay||0);
        const invs=db.purchases.filter(p=>p.sid===sp.id).slice(-20).reverse().map(p=>`<tr><td>${p.date}</td><td>${pname(prod(p.pid))}</td><td>${p.qty}</td><td>${fmt(Number(p.debt)||0)}</td><td>${fmt(Number(p.paid)||0)}</td></tr>`);
        const pays=db.spay.filter(x=>x.sid===sp.id).slice(-15).reverse().map(x=>`<tr><td>${x.date}</td><td>${fmt(Number(x.amt)||0)} $</td></tr>`);
        det=`<div class="card"><h3>${esc(sp.name)} — الدين: ${fmt(d)} $</h3>${table(['التاريخ','المنتج','الكمية','الدين','المدفوع'],invs,'')}</div><div class="card"><h3>دفعات المورد</h3>${table(['التاريخ','المبلغ'],pays,'لا توجد دفعات.')}</div>`;
      }
    }
    return `<div class="card"><h3>إضافة مورد</h3><form onsubmit="addSup(event)"><label>اسم المورد<input name="name" required></label><button class="go">إضافة</button></form></div><div class="card"><h3>موردون</h3>${table(['اسم المورد','الرصيد',''],rows,'لا توجد موردين.')}</div>${det}`;
  },
  exp(){
    const rows=db.expenses.slice(-20).reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.desc)}</td><td>${fmt(e.amt)}</td><td><button class="sm" onclick="delE('${e.id}')">حذف</button></td></tr>`);
    return `<div class="card"><h3>تسجيل مصروف</h3><form onsubmit="addE(event)"><label>التاريخ<input name="date" type="date" value="${today()}"></label><label>البند (إيجابي/سلبي)<input name="desc" required></label><label>المبلغ<input name="amt" type="number" step="0.01" required></label><button class="go">حفظ</button></form></div><div class="card"><h3>آخر المصروفات</h3>${table(['التاريخ','البند','المبلغ',''],rows,'لا توجد مصروفات.')}</div>`;
  },
  debt(){
    const C=custData();
    const names=Object.keys(C).filter(c=>C[c].rem>0.005);
    const rows=names.map(c=>`<tr><td>${esc(c)}</td><td class="low">${fmt(C[c].rem)}</td><td><button class="sm" onclick="setCust('${esc(c).replace(/'/g,"\\'") }')">تفاصيل</button></td></tr>`);
    let det='';
    const cd=C[selCust];
    if(cd){
      const payRows=db.pay.filter(p=>p.cust===selCust).slice(-15).reverse().map(p=>`<tr><td>${p.date}</td><td>${fmt(Number(p.amt)||0)}</td><td>${p.kind==='debt'?'دين إضافي':'دفعة'}</td></tr>`);
      const invRows=cd.inv.slice(-20).reverse().map(i=>`<tr><td>${i.date}</td><td>${pname(prod(i.pid))}</td><td>${fmt(Number(i.qty||0) * Number(i.price||0))}</td><td>${fmt(Number(i.debt)>0 ? Number(i.debt) : Math.max(0, (Number(i.qty||0)*(Number(i.price||0)) - (Number(i.paid)||0)))}</td></tr>`);
      det=`<div class="card"><h3>${esc(selCust)} — المتبقي: ${fmt(cd.rem)}</h3>${table(['تاريخ الفاتورة','المنتج','القيمة','الدين'],invRows,'')}</div><div class="card"><h3>دفعات العميل</h3>${table(['التاريخ','المبلغ','النوع'],payRows,'لا توجد دفعات.')}</div>`;
    }
    return `<div class="card"><h3>ديون الزبائن</h3>${table(['الزبون','المتبقي',''],rows,'لا توجد ديون.')}</div>${det}`;
  },
  rep(){ return `<div class="card"><h3>التقارير</h3><p class="empty">قريباً</p></div>`; },
  acct(){ return `<div class="card"><h3>الحساب</h3><p>البيانات تُخزن في Firebase وتدعم العمل بدون إنترنت.</p></div>`; }
};
const fail=x=>toast('تعذّر الحفظ: '+x.code);
const act={
  go(k){tab=k;render();},
  setRateFromButton(){
    const rate = prompt('أدخل سعر الصرف اليوم:', curRate() || '');
    if(rate===null) return;
    const b=writeBatch(fs); put(b,'rates',{date:today(),rate:n(rate)}); b.commit().catch(fail); toast('تم حفظ سعر الصرف');
  },
  setRate(e){e.preventDefault(); const b=writeBatch(fs); put(b,'rates',{date:today(),rate:n(e.target.elements.r.value)}); b.commit().catch(fail); toast('تم حفظ سعر الصرف'); },
  login(e){e.preventDefault(); const f=e.target.elements; signInWithEmailAndPassword(auth,f.email.value.trim(),f.pw.value).catch(()=>toast('بيانات الدخول غير صحيحة أو لا يوجد حساب'));
  },
  out(){signOut(auth);},
  addP(e){
    e.preventDefault();
    const f=e.target.elements;
    const code=(f.code.value||'').trim();
    const q=Math.max(0,Math.floor(n(f.qty.value)));
    const tot=n(f.tot.value);
    const unit=n(f.usd.value);
    const sid=f.sid.value;
    const total = tot>0 ? tot : (unit>0 ? unit*q : 0);
    if(!code) return toast('اكتب كود المنتج');
    if(!f.name.value.trim()) return toast('اكتب اسم المنتج');
    if(q<1) return toast('الكمية يجب أن تكون أكثر من صفر');
    if(!(total>0)) return toast('اكتب سعر القطعة بالدولار، أو إجمالي الفاتورة');
    if(db.products.some(p=>(p.code||'').toLowerCase()===code.toLowerCase())) return toast('هذا الكود مستخدم لمنتج آخر');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid;
    const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const unitPrice = unit>0 ? unit : (q>0 ? total/q : 0);
    const b=writeBatch(fs); const pr=doc(C('products'));
    b.set(pr,{code,name:f.name.value.trim(),size:f.size.value.trim(),color:f.color.value.trim(),supId:sid,costUsd:unitPrice,price:n(f.price.value),qty:q,ts:Date.now()});
    if(q>0) put(b,'purchases',{date:today(),pid:pr.id,sid,qty:q,costUsd:unitPrice,paid,debt});
    b.commit().catch(fail); toast(debt>0.005?'تمت الإضافة. الدين على المورد: '+fmt(debt)+' $':'تمت إضافة المنتج'); e.target.reset();
  },
  setCode(id){ const c=(prompt('الكود الجديد')||'').trim(); if(!c) return; if(db.products.some(p=>(p.code||'').toLowerCase()===c.toLowerCase())) return toast('الكود مستخدم'); const b=writeBatch(fs); b.update(D('products',id),{code:c}); b.commit(); },
  delP(id){ const p=prod(id); if(!confirm('حذف '+p.name+'؟')) return; const b=writeBatch(fs); b.delete(D('products',id)); b.commit(); },
  upP(id){ const p=prod(id); if(!p) return; const newName=prompt('اسم المنتج الجديد',p.name); if(newName===null) return; const b=writeBatch(fs); b.update(D('products',id),{name:newName.trim()}); b.commit(); },
  addS(e){
    e.preventDefault();
    const f=e.target.elements;
    const p=findP(f.code.value,f.name.value);
    if(!p) return toast('المنتج غير موجود أو غير محدد');
    const q=Math.max(0,Math.floor(n(f.qty.value))); const price=n(f.price.value); const total=q*price; const cust=(f.cust.value||'').trim();
    if(q<1) return toast('الكمية يجب أن تكون أكثر من صفر');
    if(q>p.qty) return toast('الكمية المتوفرة '+p.qty+' فقط');
    if(f.mode.value==='credit'&&!cust) return toast('اكتب اسم الزبون لتسجيل الدين');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid;
    const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const b=writeBatch(fs); b.update(D('products',p.id),{qty:increment(-q)}); put(b,'sales',{date:today(),pid:p.id,qty:q,price:price,list:p.price,cost:pc(p),cust,paid,debt}); b.commit().catch(fail); toast('تمت إضافة البيع'); e.target.reset();
  },
  addB(e){
    e.preventDefault();
    const f=e.target.elements; const p=findP(f.code.value,f.nm.value); if(!p) return toast('المنتج غير موجود أو غير محدد');
    const q=Math.max(0,Math.floor(n(f.qty.value))); const total = n(f.tot.value)>0 ? n(f.tot.value) : q*n(f.usd.value); const sid=f.sid.value;
    if(q<1||!(total>0)) return toast('اكتب سعر القطعة أو إجمالي الفاتورة');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid; const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    if(debt>0.005&&!sid) return toast('اختر المورد لتسجيل الدين');
    const b=writeBatch(fs); b.update(D('products',p.id),{qty:increment(q),costUsd:q>0?total/q:0}); put(b,'purchases',{date:today(),pid:p.id,sid,qty:q,costUsd:q>0?total/q:0,paid,debt}); b.commit().catch(fail); toast('تمت إضافة الشراء'); e.target.reset();
  },
  addSup(e){ e.preventDefault(); const b=writeBatch(fs); put(b,'suppliers',{name:e.target.elements.name.value.trim()}); b.commit().catch(fail); toast('تمت إضافة المورد'); e.target.reset(); },
  paySup(id){ const v=n(prompt('مبلغ الدفعة بالدولار')); if(v<=0) return; const b=writeBatch(fs); put(b,'spay',{date:today(),sid:id,amt:v}); b.commit(); toast('تم تسجيل الدفعة'); },
  setCust(c){selCust=c; render();},
  addCustDebt(e){ e.preventDefault(); const f=e.target.elements; const cust=(f.cust.value||'').trim(); const amt=n(f.amt.value); if(!cust||amt<=0) return toast('اكتب اسم الزبون ومبلغ الدين'); const b=writeBatch(fs); put(b,'pay',{date:today(),cust,amt,kind:'debt'}); b.commit().catch(fail); toast('تمت إضافة الدين'); e.target.reset(); },
  addE(e){ e.preventDefault(); const f=e.target.elements; const b=writeBatch(fs); put(b,'expenses',{date:f.date.value||today(),desc:f.desc.value.trim(),amt:n(f.amt.value)}); b.commit().catch(fail); toast('تم حفظ المصروف'); e.target.reset(); },
  delE(id){ if(!confirm('حذف هذا المصروف؟')) return; const b=writeBatch(fs); b.delete(D('expenses',id)); b.commit(); },
  slCalc(f,e){
    const q=(f.search&&f.search.value||'').trim();
    if(f.search && e.target && e.target.name==='search') renderProductSuggestions(f, q);
    const p=findP(f.code.value, (f.name&&f.name.value) || (f.search&&f.search.value) || '');
    if(p){ f.name.value=p.name; f.code.value=p.code; f.price.value=p.price; }
    const text = pinfo(f.code.value, (f.name&&f.name.value) || (f.search&&f.search.value) || '');
    $('#pinfo').innerHTML=text;
  },
  byCalc(f,e){ const p=findP(f.code.value,f.nm.value); if(p){ f.usd.value = p.costUsd || ''; } $('#pinfo').innerHTML=pinfo(f.code.value,f.nm.value); },
  setRm(v){rmMode=v; render();},
  setRep(v){repMode=v; render();},
  setSup(v){selSup=v; render();},
  fillProductFromSuggestion(id){ const p=db.products.find(x=>x.id===id); if(!p) return; const form=document.querySelector('form[onsubmit="addS(event)"]'); if(!form) return; form.name.value=p.name; form.code.value=p.code; form.price.value=p.price; form.qty.focus(); },
  exportJ(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download='backup-'+today()+'.json'; a.click(); }
};
Object.assign(window,act);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
