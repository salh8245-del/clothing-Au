<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b8cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة Au Clothing</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#2e1d26;--mute:#7d5f6a;--main:#f6b8cc;--main-2:#f2c3d4;--acc:#d96d95;--acc-2:#c44b7b;--line:#f4dfe8;--bad:#c0392b;--ok:#27ae60;--shadow:0 12px 28px rgba(189, 110, 142, 0.14);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#fffafc 0%,var(--bg) 34%,#fef1f5 100%);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,var(--main) 0%,var(--main-2) 100%);padding:18px 20px;font-size:22px;font-weight:800;letter-spacing:.2px;color:#542a39;box-shadow:0 4px 14px rgba(214, 122, 156, 0.18);display:flex;align-items:center;gap:10px}
nav{display:flex;overflow-x:auto;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);position:sticky;top:0;backdrop-filter:blur(8px);z-index:10}
nav button{flex:1;min-width:92px;padding:12px 8px;border:0;background:transparent;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s ease;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
nav button:hover{background:#fff7fa;color:var(--ink);transform:translateY(-1px)}
nav button.on{color:#a33562;border-color:var(--acc);font-weight:800;background:linear-gradient(180deg,#fffafc 0%,#fff1f6 100%)}
main{max-width:940px;margin:0 auto;padding:18px 14px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
h3{margin:0 0 12px;font-size:18px;color:#612d40;display:flex;align-items:center;gap:8px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:5px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffafc;color:var(--ink);font:inherit;width:100%;transition:border-color .15s ease, box-shadow .15s ease}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,109,149,.12);outline:none}
input[readonly]{background:#fff5f8}

button.go{background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);color:#fff;border:none;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;align-self:end;box-shadow:0 8px 18px rgba(196,75,123,.22);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s ease}
button.go:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(196,75,123,.3)}
button.go:active{transform:translateY(0)}

button.sm{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s ease}
button.sm:hover{background:#fff1f6;border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:700}
.low{color:var(--bad);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:8px 0;margin:0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(38,26,31,.96);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;box-shadow:0 16px 28px rgba(43,25,35,.25)}
#productSearchList{display:grid;gap:6px;margin:8px 0}
.product-suggestion{padding:10px 12px;border:1px solid var(--line);background:#fffafc;border-radius:10px;cursor:pointer;text-align:right;color:var(--ink);font:inherit;transition:all .15s ease}
.product-suggestion:hover{background:#ffeaf2;border-color:var(--acc);transform:translateY(-1px)}
:focus-visible{outline:3px solid rgba(217,109,149,.35);outline-offset:2px}
</style>
</head>
<body>
<header>✨ برنامج محاسبة لمحل Au Clothing</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDocs,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp(firebaseConfig);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns','suppliers','spay','rates'];
const EMPTY=()=>Object.fromEntries(NAMES.map(k=>[k,[]]));
let uid=null,unsubs=[],loaded=false,tab='products',selSup='',selCust='';
let db=EMPTY();
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)}`:'(محذوف)';

const tabs={
  products:'📦 المنتجات',
  sale:'🛍️ بيع',
  buy:'🛒 شراء',
  rs:'🔄 مرتجع وتبديل',
  sup:'👥 الموردين وجرد',
  exp:'💸 المصاريف',
  debt:'📋 الديون',
  rep:'📊 التقارير',
  acct:'⚙️ الحساب'
};

function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}
function debtValue(total,mode,manualDebt,paid){
  if(mode!=='credit') return {paid:total,debt:0};
  if(manualDebt>0) return {paid:Math.max(0,total-manualDebt),debt:manualDebt};
  const p=Math.min(n(paid),total);
  return {paid:p,debt:Math.max(0,total-p)};
}
const supOpts=v=>'<option value="">بدون مورد</option>'+db.suppliers.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${esc(s.name)}</option>`).join('');
const supName=id=>{const s=db.suppliers.find(x=>x.id===id);return s?esc(s.name):'-'};

const productMatches=(text)=>{
  const q=(text||'').trim().toLowerCase(); 
  if(q.length<1) return []; 
  return db.products.filter(p=>((p.code||'')+' '+(p.name||'')+' '+(p.size||'')+' '+(p.color||'')).toLowerCase().includes(q)).slice(0,8)
};

function renderProductSuggestions(form,query){ 
  const list=$('#productSearchList'); 
  if(!list) return; 
  const matches=productMatches(query); 
  if(!matches.length){list.innerHTML='<div class="empty">لا توجد منتجات مطابقة.</div>'; return;} 
  list.innerHTML=matches.map(p=>`<div class="product-suggestion" onclick="fillProductFromSuggestion('${p.id}')">🏷️ <b>${esc(p.name)}</b> — مقاس: ${esc(p.size)} | لون: ${esc(p.color)} | الكود: <code>${esc(p.code)}</code> | المتبقي: <b>${p.qty}</b></div>`).join(''); 
}

const findP=(c,nm)=>{ 
  const q=(c||'').trim().toLowerCase(); 
  const s=(nm||'').trim().toLowerCase(); 
  const hits=[]; 
  if(q) hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q)); 
  if(s) hits.push(...db.products.filter(p=>((p.name||'').toLowerCase()===s)||(p.name||'').toLowerCase().includes(s))); 
  return hits[0]||null; 
};

const pinfo=(c,nm)=>{ 
  if(!(c||'').trim()&&!(nm||'').trim()) return ''; 
  const q=(c||'').trim().toLowerCase(); 
  const s=(nm||'').trim().toLowerCase(); 
  const hits=[]; 
  if(q) hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q)); 
  if(s) hits.push(...db.products.filter(p=>((p.name||'').toLowerCase()===s)||(p.name||'').toLowerCase().includes(s))); 
  if(!hits.length) return '<div class="empty">⚠️ لم يتم العثور على منتج بهذا الكود أو الاسم.</div>'; 
  const top=hits.slice(0,4); 
  return top.map(p=>`<div class="product-suggestion" style="cursor:default">✅ <b>${esc(p.name)}</b> • مقاس: ${esc(p.size)} • لون: ${esc(p.color)} • كود: ${esc(p.code)} • <b>الكمية المتاحة: ${p.qty}</b></div>`).join(''); 
};

const curRate=()=>{const r=db.rates.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):0};
const pc=p=>p.costUsd?p.costUsd*curRate():n(p.cost);
const banner=()=>{const ok=db.rates.some(x=>x.date===today()),r=curRate();return `<div class="card"><form onsubmit="setRate(event)"><label>${ok?'💱 سعر صرف اليوم':'💱 أدخل سعر صرف اليوم'}<input name="r" type="number" step="0.001" value="${r||''}" required></label><button class="go">💾 حفظ الصرف</button></form></div>`};

function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">⏳ جارٍ تحميل البيانات...</div>';
  $('#app').innerHTML=banner()+views[tab]();
}

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;
  if(u){uid=u.uid;let got=0;NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),s=>{ db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0)); if(++got>=NAMES.length){loaded=true;render();}})));}
  else{uid=null;db=EMPTY();render();}
});

const views={
  login(){return `<div class="card"><h3>🔐 تسجيل الدخول</h3><form onsubmit="login(event)"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input name="pw" type="password" required autocomplete="current-password"></label><button class="go">🚀 دخول</button></form></div>`;},
  
  products(){
    const rate=curRate();
    const rows=db.products.map(p=>{
      const costLek=pc(p);
      const profit=n(p.price)-costLek;
      const profitMargin=costLek>0?((profit/costLek)*100).toFixed(1):0;
      return `<tr><td><code>${esc(p.code)}</code></td><td><b>${esc(p.name)}</b></td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${supName(p.supId)}</td><td>${fmt(costLek)}</td><td>${fmt(p.price)}</td><td class="${profit>=0?'ok':'low'}">${fmt(profit)} (${profitMargin}%)</td><td><b>${p.qty}</b></td><td><button class="sm" onclick="upP('${p.id}')">✏️ تعديل</button> <button class="sm" onclick="delP('${p.id}')" style="color:var(--bad)">🗑️ حذف</button></td></tr>`;
    });
    return `<div class="card"><h3>➕ إضافة منتج جديد</h3><form onsubmit="addP(event)"><label>كود المنتج<input name="code" required placeholder="مثال: A101"></label><label>اسم المنتج<input name="name" required placeholder="مثال: فستان سهرة"></label><label>المقاس<input name="size" placeholder="L / M / 38"></label><label>اللون<input name="color" placeholder="أسود / وردي"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>الكمية<input name="qty" type="number" min="1" required value="1"></label><label>التكلفة بالدولار ($)<input name="usd" type="number" step="0.01"></label><label>إجمالي التكلفة<input name="tot" type="number" step="0.01"></label><label>سعر البيع<input name="price" type="number" step="0.01" required></label><label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>المدفوع<input name="paid" type="number" step="0.01"></label><label>الدين يدويًا<input name="debt" type="number" step="0.01"></label><button class="go">✨ حفظ المنتج</button></form></div><div class="card"><h3>📦 قائمة المنتجات وحساب الأرباح (سعر الصرف الحالي: ${fmt(rate)})</h3>${table(['الكود','اسم المنتج','المقاس','اللون','المورد','التكلفة المحلیة','سعر البيع','الربح التقديري','الكمية','الإجراءات'],rows,'لا توجد منتجات مسجلة.')}</div>`;
  },
  
  sale(){
    const rows=db.sales.slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td><b>${pname(prod(s.pid))}</b></td><td>${esc(s.cust||'-')}</td><td><b>${s.qty}</b></td><td><b>${fmt(s.qty*s.price)}</b></td><td>${s.debt>0?'<span class="low">آجل (دين: '+fmt(s.debt)+')</span>':'<span class="ok">نقدي</span>'}</td></tr>`);
    return `<div class="card"><h3>🛍️ فاتورة بيع جديدة</h3>
      <form onsubmit="addS(event)" oninput="slCalc(this,event)">
        <div style="grid-column:1/-1; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; background:#fff7fa; padding:12px; border-radius:10px; border:1px solid var(--line);">
          <label>🏷️ اسم المنتج<input name="name" autocomplete="off" placeholder="اسم المنتج"></label>
          <label>🔢 كود المنتج<input name="code" autocomplete="off" placeholder="كود المنتج"></label>
        </div>
        <label>سعر القطعة<input name="price" type="number" step="0.01" placeholder="السعر"></label>
        <label>الكمية المباعة<input name="qty" type="number" min="1" step="1" value="1" placeholder="الكمية"></label>
        <label>اسم الزبون<input name="cust" placeholder="اسم الزبون"></label>
        <label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل / دين</option></select></label>
        <label>المدفوع نقداً<input name="paid" type="number" step="0.01" placeholder="المدفوع"></label>
        <label>الدين المتبقي<input name="debt" type="number" step="0.01" placeholder="الدين"></label>
        <button class="go">💾 إتمام وحفظ البيع</button>
      </form>
      <div id="productSearchList"></div>
      <div id="pinfo" style="margin-top:8px"></div>
    </div>
    <div class="card"><h3>📋 سجل آخر المبيعات</h3>${table(['التاريخ','المنتج','الزبون','الكمية','الإجمالي','الحالة'],rows,'لا توجد مبيعات مسجلة حتى الآن.')}</div>`;
  },
  
  buy(){
    const rows=db.purchases.filter(p=>p.sid!==undefined).slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td><b>${pname(prod(s.pid))}</b></td><td>${supName(s.sid)}</td><td><b>${s.qty}</b></td><td>${fmt(s.costUsd||0)} $</td><td>${fmt(s.paid||0)}</td><td><span class="${n(s.debt)>0?'low':''}">${fmt(s.debt||0)}</span></td></tr>`);
    return `<div class="card"><h3>🛒 فاتورة شراء بضاعة</h3><form onsubmit="addB(event)" oninput="byCalc(this,event)"><label>كود المنتج<input name="code" autocomplete="off" placeholder="الكود"></label><label>اسم المنتج<input name="nm" autocomplete="off" placeholder="الاسم"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>الكمية<input name="qty" type="number" min="1" step="1" value="1"></label><label>سعر القطعة ($)<input name="usd" type="number" step="0.01"></label><label>الإجمالي ($)<input name="tot" type="number" step="0.01"></label><label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>المدفوع<input name="paid" type="number" step="0.01"></label><label>الدين للمورد<input name="debt" type="number" step="0.01"></label><button class="go">💾 حفظ الشراء</button></form><div id="pinfo" style="margin-top:8px"></div></div><div class="card"><h3>📦 سجل المشتريات</h3>${table(['التاريخ','المنتج','المورد','الكمية','التكلفة','المدفوع','الدين'],rows,'لا توجد مشتريات.')}</div>`;
  },
  
  rs(){
    const rows=db.returns.slice(-20).reverse().map(r=>`<tr><td>${r.date}</td><td><b>${pname(prod(r.pid))}</b></td><td>${r.type==='return'?'مرتجع (استرداد)':'تبديل بمنتج آخر'}</td><td>${r.qty}</td><td>${fmt(r.amt)}</td></tr>`);
    return `
      <div class="card">
        <h3>🔄 تسجيل مرتجع أو تبديل منتج</h3>
        <form onsubmit="addReturn(event)" oninput="rsCalc(this,event)">
          <label>🔢 كود المنتج المرتجع<input name="code" autocomplete="off" placeholder="كود المنتج"></label>
          <label>🏷️ اسم المنتج<input name="name" autocomplete="off" placeholder="اسم المنتج"></label>
          <label>نوع العملية<select name="type"><option value="return">مرتجع (إرجاع للمخزون واسترداد)</option><option value="exchange">تبديل (استبدال بمنتج آخر)</option></select></label>
          <label>الكمية<input name="qty" type="number" min="1" value="1" required></label>
          <label>المبلغ المالي المعاد/المعدل<input name="amt" type="number" step="0.01" required placeholder="المبلغ"></label>
          <button class="go">💾 حفظ المرتجع / التبديل</button>
        </form>
        <div id="productSearchList"></div>
        <div id="pinfo" style="margin-top:8px"></div>
      </div>
      <div class="card"><h3>📋 سجل المرتجعات والتبديلات</h3>${table(['التاريخ','المنتج','النوع','الكمية','المبلغ'],rows,'لا توجد مرتجعات مسجلة.')}</div>
    `;
  },
  
  sup(){
    const rows=db.suppliers.map(s=>{
      const spPurchases=db.purchases.filter(p=>p.sid===s.id);
      const totalQty=spPurchases.reduce((a,b)=>a+n(b.qty),0);
      const totalCost=spPurchases.reduce((a,b)=>a+(n(b.qty)*n(b.costUsd)),0);
      return `<tr><td><b>${esc(s.name)}</b></td><td><b>${spPurchases.length}</b> فواتير شراء</td><td><b>${totalQty}</b> قطعة</td><td><b>${fmt(totalCost)} $</b></td><td><button class="sm" onclick="viewSupplierJard('${s.id}')">📋 جرد المورد</button></td></tr>`;
    });
    let jardHTML='';
    if(selSup){
      const sp=db.suppliers.find(x=>x.id===selSup);
      if(sp){
        const items=db.purchases.filter(p=>p.sid===sp.id).reverse().map(p=>`<tr><td>${p.date}</td><td>${pname(prod(p.pid))}</td><td>${p.qty}</td><td>${fmt(p.costUsd)} $</td><td><b>${fmt(p.qty*p.costUsd)} $</b></td></tr>`);
        jardHTML=`<div class="card"><h3>📋 جرد المشتريات للمورد: ${esc(sp.name)}</h3>${table(['التاريخ','المنتج','الكمية','سعر القطعة ($)','الإجمالي ($)'],items,'لا توجد مشتريات لهذا المورد.')}</div>`;
      }
    }
    return `<div class="card"><h3>➕ إضافة مورد جديد</h3><form onsubmit="addSup(event)"><label>اسم المورد<input name="name" required placeholder="اسم شركة أو شخص"></label><button class="go">✨ إضافة مورد</button></form></div><div class="card"><h3>👥 الموردون وجرد البضاعة</h3>${table(['اسم المورد','عدد الفواتير','إجمالي القطع','إجمالي التكلفة ($)','الإجراءات'],rows,'لا توجد موردين مسجلين.')}</div>${jardHTML}`;
  },
  
  exp(){
    const rows=db.expenses.slice(-30).reverse().map(e=>`<tr><td>${e.date}</td><td><b>${esc(e.desc)}</b></td><td><b>${fmt(e.amt)}</b></td><td><button class="sm" onclick="delE('${e.id}')" style="color:var(--bad)">🗑️ حذف</button></td></tr>`);
    return `<div class="card"><h3>💸 تسجيل مصروف تشغيلي</h3><form onsubmit="addE(event)"><label>التاريخ<input name="date" type="date" value="${today()}"></label><label>البند (إيجار/رواتب/أخرى)<input name="desc" required placeholder="مثال: فاتورة كهرباء"></label><label>المبلغ<input name="amt" type="number" step="0.01" required placeholder="المبلغ"></label><button class="go">💾 حفظ المصروف</button></form></div><div class="card"><h3>📋 سجل المصروفات</h3>${table(['التاريخ','البند','المبلغ','الإجراءات'],rows,'لا توجد مصاريف مسجلة.')}</div>`;
  },
  
  debt(){
    return `<div class="card"><h3>📋 إدارة الديون والتحصيل</h3><p>يمكنك متابعة ديون الزبائن وتسجيل دفعات السداد التي تدخل مباشرة في صندوق اليومية كإيرادات.</p></div>`;
  },
  
  rep(){
    const d=today();
    const curMonth=d.slice(0,7);
    
    // المبيعات النقدية اليومية + تحصيلات الديون اليومية
    const dayCashSales=db.sales.filter(s=>s.date===d && (!s.debt || s.debt<=0)).reduce((a,b)=>a+(b.qty*b.price),0);
    const dayPartialPaid=db.sales.filter(s=>s.date===d && s.debt>0).reduce((a,b)=>a+n(b.paid),0);
    const dayDebtPayments=db.pay.filter(p=>p.date===d && p.kind!=='debt').reduce((a,b)=>a+n(b.amt),0);
    const totalDayRevenue = dayCashSales + dayPartialPaid + dayDebtPayments;

    // المبيعات النقدية الشهرية + تحصيلات الديون الشهرية
    const monthCashSales=db.sales.filter(s=>s.date.startsWith(curMonth) && (!s.debt || s.debt<=0)).reduce((a,b)=>a+(b.qty*b.price),0);
    const monthPartialPaid=db.sales.filter(s=>s.date.startsWith(curMonth) && s.debt>0).reduce((a,b)=>a+n(b.paid),0);
    const monthDebtPayments=db.pay.filter(p=>p.date.startsWith(curMonth) && p.kind!=='debt').reduce((a,b)=>a+n(b.amt),0);
    const totalMonthRevenue = monthCashSales + monthPartialPaid + monthDebtPayments;

    const dayExp=db.expenses.filter(e=>e.date===d).reduce((a,b)=>a+n(b.amt),0);
    const monthExp=db.expenses.filter(e=>e.date.startsWith(curMonth)).reduce((a,b)=>a+n(b.amt),0);

    return `
      <div class="card">
        <h3>📊 التقارير المالية (اليومية والشهرية)</h3>
        <p style="font-size:13px; color:var(--mute); margin-bottom:14px;">ملاحظة: المبيعات الآجلة لا تُحتسب ضمن الإيرادات إلا عند دفع قيمتها نقداً.</p>
        <div class="kpi">
          <div><span>إيرادات اليوم النقدية</span><b>${fmt(totalDayRevenue)}</b></div>
          <div><span>مصاريف اليوم</span><b class="low">${fmt(dayExp)}</b></div>
          <div><span>صافي اليوم</span><b class="ok">${fmt(totalDayRevenue - dayExp)}</b></div>
        </div>
        <hr style="border:0; border-top:1px solid var(--line); margin:16px 0;">
        <div class="kpi">
          <div><span>إيرادات الشهر (${curMonth})</span><b>${fmt(totalMonthRevenue)}</b></div>
          <div><span>مصاريف الشهر</span><b class="low">${fmt(monthExp)}</b></div>
          <div><span>صافي الشهر</span><b class="ok">${fmt(totalMonthRevenue - monthExp)}</b></div>
        </div>
      </div>
    `;
  },
  
  acct(){ 
    return `
      <div class="card">
        <h3>⚙️ إعدادات الحساب والنظام</h3>
        <p>جميع البيانات تُخزن بشكل آمن في سحابة Firebase وتعمل بدون إنترنت.</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
          <button class="go" onclick="exportJ()">📥 تصدير نسخة احتياطية (JSON)</button>
          <button class="go" onclick="out()" style="background:linear-gradient(135deg, #7d5f6a 0%, #542a39 100%);">🚪 تسجيل الخروج</button>
        </div>
      </div>
      <div class="card" style="border:1px solid #f2b4b4; background:#fff8f8;">
        <h3 style="color:var(--bad)">⚠️ منطقة الخطر - إعادة ضبط البيانات</h3>
        <button class="go" onclick="resetAllData()" style="background:linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">🗑️ إعادة ضبط المسح الكلي للنظام</button>
      </div>
    `;
  }
};

const fail=x=>toast('تعذّر الحفظ: '+x.code);

const act={
  go(k){tab=k;render();},
  setRate(e){e.preventDefault(); const b=writeBatch(fs); put(b,'rates',{date:today(),rate:n(e.target.elements.r.value)}); b.commit().catch(fail); toast('✅ تم حفظ سعر الصرف'); },
  login(e){e.preventDefault(); const f=e.target.elements; signInWithEmailAndPassword(auth,f.email.value.trim(),f.pw.value).catch(()=>toast('❌ بيانات الدخول غير صحيحة')); },
  out(){signOut(auth);},
  
  addP(e){
    e.preventDefault();
    const f=e.target.elements;
    const code=(f.code.value||'').trim();
    const q=Math.max(0,Math.floor(n(f.qty.value)));
    const tot=n(f.tot.value);
    const unit=n(f.usd.value);
    const sid=f.sid.value;
    const total = tot>0 ? tot : (unit>0 ? unit*q : 0);
    if(!code) return toast('اكتب كود المنتج');
    if(!f.name.value.trim()) return toast('اكتب اسم المنتج');
    if(q<1) return toast('الكمية يجب أن تكون أكثر من صفرة');
    if(!(total>0)) return toast('اكتب سعر القطعة بالدولار أو إجمالي التكلفة');
    if(db.products.some(p=>(p.code||'').toLowerCase()===code.toLowerCase())) return toast('هذا الكود مستخدم لمنتج آخر');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid;
    const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const unitPrice = unit>0 ? unit : (q>0 ? total/q : 0);
    const b=writeBatch(fs); const pr=doc(C('products'));
    b.set(pr,{code,name:f.name.value.trim(),size:f.size.value.trim(),color:f.color.value.trim(),supId:sid,costUsd:unitPrice,price:n(f.price.value),qty:q,ts:Date.now()});
    if(q>0) put(b,'purchases',{date:today(),pid:pr.id,sid,qty:q,costUsd:unitPrice,paid,debt});
    b.commit().catch(fail); toast('✅ تمت إضافة المنتج بنجاح'); e.target.reset();
  },
  
  delP(id){ const p=prod(id); if(!confirm('هل تريد حذف المنتج: '+p.name+'؟')) return; const b=writeBatch(fs); b.delete(D('products',id)); b.commit(); },
  upP(id){ const p=prod(id); if(!p) return; const newName=prompt('اسم المنتج الجديد',p.name); if(newName===null) return; const b=writeBatch(fs); b.update(D('products',id),{name:newName.trim()||p.name}); b.commit(); },
  
  addS(e){
    e.preventDefault();
    const f=e.target.elements;
    const p=findP(f.code.value,f.name.value);
    if(!p) return toast('⚠️ المنتج غير موجود، تأكد من الكود أو الاسم');
    const q=Math.max(0,Math.floor(n(f.qty.value))); const price=n(f.price.value); const total=q*price; const cust=(f.cust.value||'').trim();
    if(q<1) return toast('الكمية يجب أن تكون أكثر من صفر');
    if(q>p.qty) return toast('⚠️ الكمية المتوفرة في المخزون هي '+p.qty+' فقط');
    if(f.mode.value==='credit'&&!cust) return toast('اكتب اسم الزبون لتسجيل الدين الآجل');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid;
    const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const b=writeBatch(fs); 
    b.update(D('products',p.id),{qty:increment(-q)}); 
    put(b,'sales',{date:today(),pid:p.id,qty:q,price:price,list:p.price,cost:pc(p),cust,paid,debt}); 
    b.commit().catch(fail); 
    toast('✅ تم حفظ عملية البيع بنجاح'); 
    e.target.reset();
    const list = $('#productSearchList'); if(list) list.innerHTML = '';
    const pinfoEl = $('#pinfo'); if(pinfoEl) pinfoEl.innerHTML = '';
  },
  
  addB(e){
    e.preventDefault();
    const f=e.target.elements; const p=findP(f.code.value,f.nm.value); if(!p) return toast('⚠️ المنتج غير موجود');
    const q=Math.max(0,Math.floor(n(f.qty.value))); const total = n(f.tot.value)>0 ? n(f.tot.value) : q*n(f.usd.value); const sid=f.sid.value;
    if(q<1||!(total>0)) return toast('اكتب سعر القطعة أو إجمالي الفاتورة');
    const debtInfo = debtValue(total, f.mode.value, n(f.debt.value), n(f.paid.value));
    const paid = f.mode.value==='cash' ? total : debtInfo.paid; const debt = f.mode.value==='cash' ? 0 : debtInfo.debt;
    const b=writeBatch(fs); b.update(D('products',p.id),{qty:increment(q),costUsd:q>0?total/q:0}); put(b,'purchases',{date:today(),pid:p.id,sid,qty:q,costUsd:q>0?total/q:0,paid,debt}); b.commit().catch(fail); toast('✅ تم حفظ الشراء'); e.target.reset();
  },

  addReturn(e){
    e.preventDefault();
    const f=e.target.elements;
    const p=findP(f.code.value,f.name.value);
    if(!p) return toast('⚠️ المنتج غير موجود');
    const q=n(f.qty.value);
    const amt=n(f.amt.value);
    const type=f.type.value;
    const b=writeBatch(fs);
    if(type==='return'){
      b.update(D('products',p.id),{qty:increment(q)});
    }
    put(b,'returns',{date:today(),pid:p.id,type,qty:q,amt});
    b.commit().catch(fail);
    toast('✅ تم حفظ المرتجع بنجاح');
    e.target.reset();
  },
  
  addSup(e){ e.preventDefault(); const b=writeBatch(fs); put(b,'suppliers',{name:e.target.elements.name.value.trim()}); b.commit().catch(fail); toast('✅ تمت إضافة المورد'); e.target.reset(); },
  viewSupplierJard(id){ selSup=id; render(); },
  addE(e){ e.preventDefault(); const f=e.target.elements; const b=writeBatch(fs); put(b,'expenses',{date:f.date.value||today(),desc:f.desc.value.trim(),amt:n(f.amt.value)}); b.commit().catch(fail); toast('✅ تم حفظ المصروف'); e.target.reset(); },
  delE(id){ if(!confirm('حذف هذا المصروف؟')) return; const b=writeBatch(fs); b.delete(D('expenses',id)); b.commit(); },
  
  slCalc(f,e){
    const nameVal = (f.name && f.name.value || '').trim();
    const codeVal = (f.code && f.code.value || '').trim();
    if(e && (e.target.name==='name' || e.target.name==='code')){
      renderProductSuggestions(f, nameVal || codeVal);
    }
    const p = findP(codeVal, nameVal);
    if(p){ 
      if(f.name && !f.name.value) f.name.value = p.name;
      if(f.code && !f.code.value) f.code.value = p.code;
      if(f.price) f.price.value = p.price; 
    }
    const text = pinfo(codeVal, nameVal);
    $('#pinfo').innerHTML = text;
  },

  rsCalc(f,e){
    const nameVal = (f.name && f.name.value || '').trim();
    const codeVal = (f.code && f.code.value || '').trim();
    const p = findP(codeVal, nameVal);
    if(p){ 
      if(f.name && !f.name.value) f.name.value = p.name;
      if(f.code && !f.code.value) f.code.value = p.code;
    }
    $('#pinfo').innerHTML = pinfo(codeVal, nameVal);
  },

  byCalc(f,e){ const p=findP(f.code.value,f.nm.value); if(p){ f.usd.value = p.costUsd || ''; } $('#pinfo').innerHTML=pinfo(f.code.value,f.nm.value); },
  
  fillProductFromSuggestion(id){ 
    const p = db.products.find(x => x.id === id); 
    if(!p) return; 
    const form = document.querySelector('form'); 
    if(!form) return; 
    if(form.name) form.name.value = p.name; 
    if(form.code) form.code.value = p.code; 
    if(form.price) form.price.value = p.price; 
    const list = $('#productSearchList'); if(list) list.innerHTML = '';
  },
  
  exportJ(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download='Au-Clothing-Backup-'+today()+'.json'; a.click(); },

  async resetAllData() {
    if (!confirm("⚠️ هل أنت متأكد تماماً من رغبتك في مسح كل شيء من النظام؟")) return;
    const confirmText = prompt("اكتب كلمة (حذف) للتأكيد:");
    if (!confirmText || confirmText.trim() !== 'حذف') return toast("❌ تم الإلغاء");
    try {
      for (const k of NAMES) {
        const querySnapshot = await getDocs(C(k));
        if (!querySnapshot.empty) {
          const b = writeBatch(fs);
          querySnapshot.forEach(docSnap => b.delete(docSnap.ref));
          await b.commit();
        }
      }
      toast("✅ تم مسح البيانات بنجاح!");
      setTimeout(() => location.reload(), 1500);
    } catch (err) { fail(err); }
  }
};

Object.assign(window,act);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
