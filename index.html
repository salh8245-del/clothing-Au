<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b8cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة Au Clothing</title>
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#2e1d26;--mute:#7d5f6a;--main:#f6b8cc;--main-2:#f2c3d4;--acc:#d96d95;--acc-2:#c44b7b;--line:#f4dfe8;--bad:#c0392b;--ok:#27ae60;--shadow:0 12px 28px rgba(189,110,142,.14);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#fffafc 0%,var(--bg) 34%,#fef1f5 100%);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,var(--main) 0%,var(--main-2) 100%);padding:18px 20px;font-size:22px;font-weight:800;color:#542a39;box-shadow:0 4px 14px rgba(214,122,156,.18);display:flex;align-items:center;gap:10px}
nav{display:flex;overflow-x:auto;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);position:sticky;top:0;backdrop-filter:blur(8px);z-index:10}
nav button{flex:1;min-width:92px;padding:12px 8px;border:0;background:transparent;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s ease;font-weight:700;font-size:13px}
nav button:hover{background:#fff7fa;color:var(--ink)}
nav button.on{color:#a33562;border-color:var(--acc);font-weight:800;background:linear-gradient(180deg,#fffafc 0%,#fff1f6 100%)}
main{max-width:940px;margin:0 auto;padding:18px 14px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
h3{margin:0 0 12px;font-size:18px;color:#612d40;display:flex;align-items:center;gap:8px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:5px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffafc;color:var(--ink);font:inherit;width:100%}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(217,109,149,.12);outline:none}
input[readonly]{background:#fff5f8}
button.go{background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);color:#fff;border:none;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;align-self:end;box-shadow:0 8px 18px rgba(196,75,123,.22)}
button.sm{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button.sm:hover{background:#fff1f6;border-color:var(--acc);color:var(--acc)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:700}
.low{color:var(--bad);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:8px 0;margin:0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(38,26,31,.96);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
#productSearchList{display:grid;gap:6px;margin:8px 0}
.product-suggestion{padding:10px 12px;border:1px solid var(--line);background:#fffafc;border-radius:10px;cursor:pointer;text-align:right;color:var(--ink);font:inherit}
.product-suggestion:hover{background:#ffeaf2;border-color:var(--acc)}
:focus-visible{outline:3px solid rgba(217,109,149,.35);outline-offset:2px}
.box-highlight{background:#fff0f5;padding:12px;border-radius:10px;border:1px dashed var(--acc);margin-bottom:10px}
</style>
</head>
<body>
<header>✨ برنامج محاسبة لمحل Au Clothing</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp(firebaseConfig);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns','suppliers','spay','rates'];
const EMPTY=()=>Object.fromEntries(NAMES.map(k=>[k,[]]));
let uid=null,unsubs=[],loaded=false,tab='products',selSup='',rsType='return',jardFilter='',rptD='';
let db=EMPTY();
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)}`:'(محذوف)';

const tabs={products:'📦 المنتجات',sale:'🛍️ بيع وسجل المبيعات',buy:'🛒 شراء',rs:'🔄 مرتجع وتبديل',jard:'📦 الجرد والمخزون',sup:'👥 الموردين',exp:'💸 المصاريف',debt:'📋 الديون',rep:'📊 التقارير',acct:'⚙️ الحساب'};

function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}

/* ديون الموردين بالدولار: الدين المسجل فقط (إصلاح: لا يُحتسب الفرق كدين) */
function supplierDebtMap(){
  const map={};
  db.suppliers.forEach(s=>{map[s.id]={due:0,pay:0}});
  db.purchases.forEach(p=>{if(!p.sid)return;(map[p.sid]??={due:0,pay:0}).due+=n(p.debt)});
  db.spay.forEach(p=>{if(!p.sid)return;(map[p.sid]??={due:0,pay:0}).pay+=n(p.amt)});
  return map;
}
/* ديون الزبائن: الدين المسجل فقط، فلا يتحول الخصم إلى دين */
function custData(){
  const R={};
  db.sales.forEach(s=>{const name=(s.cust||'').trim();if(!name||n(s.debt)<=0.005)return;(R[name]??={inv:[],pay:0,extraDebt:0,due:0}).due+=n(s.debt);R[name].inv.push(s)});
  db.pay.forEach(p=>{const name=(p.cust||'').trim();if(!name)return;const c=(R[name]??={inv:[],pay:0,extraDebt:0,due:0});if(p.kind==='debt')c.extraDebt+=n(p.amt);else c.pay+=n(p.amt)});
  Object.values(R).forEach(c=>c.rem=c.due+c.extraDebt-c.pay);
  return R;
}
const supOpts=v=>'<option value="">بدون مورد</option>'+db.suppliers.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${esc(s.name)}</option>`).join('');
const supName=id=>{const s=db.suppliers.find(x=>x.id===id);return s?esc(s.name):'-'};

const findP=(c,nm)=>{
  const q=(c||'').trim().toLowerCase(),s=(nm||'').trim().toLowerCase(),hits=[];
  if(q)hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q));
  if(s)hits.push(...db.products.filter(p=>(p.name||'').toLowerCase()===s||(p.name||'').toLowerCase().includes(s)));
  return hits[0]||null;
};
const pinfo=(c,nm)=>{
  const q=(c||'').trim().toLowerCase(),s=(nm||'').trim().toLowerCase();
  if(!q&&!s)return '';
  const hits=[];
  if(q)hits.push(...db.products.filter(p=>(p.code||'').toLowerCase()===q));
  if(s)hits.push(...db.products.filter(p=>(p.name||'').toLowerCase()===s||(p.name||'').toLowerCase().includes(s)));
  if(!hits.length)return '<div class="empty">⚠️ لم يتم العثور على منتج بهذا الكود أو الاسم.</div>';
  return hits.slice(0,4).map(p=>`<div class="product-suggestion" style="cursor:default">✅ <b>${esc(p.name)}</b> • مقاس: ${esc(p.size)} • لون: ${esc(p.color)} • كود: ${esc(p.code)} • <b>المتاح: ${p.qty}</b></div>`).join('');
};
const productMatches=t=>{const q=(t||'').trim().toLowerCase();if(!q)return[];return db.products.filter(p=>((p.code||'')+' '+(p.name||'')+' '+(p.size||'')+' '+(p.color||'')).toLowerCase().includes(q)).slice(0,8)};
function renderProductSuggestions(f,query){
  const list=$('#productSearchList');if(!list)return;
  const m=productMatches(query);
  list.innerHTML=m.length?m.map(p=>`<div class="product-suggestion" onclick="fillProductFromSuggestion('${p.id}')">🏷️ <b>${esc(p.name)}</b> — مقاس: ${esc(p.size)} | لون: ${esc(p.color)} | الكود: <code>${esc(p.code)}</code> | المتبقي: <b>${p.qty}</b></div>`).join(''):'<div class="empty">لا توجد منتجات مطابقة.</div>';
}

const curRate=()=>{const r=db.rates.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):0};
const pc=p=>p.costUsd?p.costUsd*curRate():n(p.cost);
/* دوال الربح الموحدة (للمبيعات والتقارير) */
const saleNet=s=>n(s.qty)*n(s.price)-n(s.discount);
const saleProfit=s=>saleNet(s)-n(s.cost)*n(s.qty);
const banner=()=>{const ok=db.rates.some(x=>x.date===today()),r=curRate();return `<div class="card"><form onsubmit="setRate(event)"><label>${ok?'💱 سعر صرف اليوم':'💱 أدخل سعر صرف اليوم'}<input name="r" type="number" step="0.001" value="${r||''}" required></label><button class="go">💾 حفظ الصرف</button></form></div>`};

function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">⏳ جارٍ تحميل البيانات...</div>';
  const keep=document.activeElement&&document.activeElement.form?null:null;
  $('#app').innerHTML=banner()+views[tab]();
}

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;
  if(u){uid=u.uid;let got=0;NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),s=>{db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));if(++got>=NAMES.length){loaded=true;render()}})))}
  else{uid=null;db=EMPTY();render()}
});

const views={
  login(){return `<div class="card"><h3>🔐 تسجيل الدخول</h3><form onsubmit="login(event)"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input name="pw" type="password" required autocomplete="current-password"></label><button class="go">🚀 دخول</button></form></div>`},

  products(){
    const rate=curRate();
    const rows=db.products.map(p=>{
      const cost=pc(p),profit=n(p.price)-cost,pm=cost>0?((profit/cost)*100).toFixed(1):0;
      return `<tr><td><code>${esc(p.code)}</code></td><td><b>${esc(p.name)}</b></td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${supName(p.supId)}</td><td>${fmt(cost)}</td><td>${fmt(p.price)}</td><td class="${profit>=0?'ok':'low'}">${fmt(profit)} (${pm}%)</td><td><b>${p.qty}</b></td><td><button class="sm" onclick="upP('${p.id}')">✏️ تعديل</button> <button class="sm" onclick="delP('${p.id}')" style="color:var(--bad)">🗑️ حذف</button></td></tr>`;
    });
    return `<div class="card"><h3>➕ إضافة منتج جديد</h3><form onsubmit="addP(event)"><label>كود المنتج<input name="code" required placeholder="مثال: A101"></label><label>اسم المنتج<input name="name" required placeholder="مثال: فستان سهرة"></label><label>المقاس<input name="size" placeholder="L / M / 38"></label><label>اللون<input name="color" placeholder="أسود / وردي"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>الكمية<input name="qty" type="number" min="1" required value="1"></label><label>تكلفة القطعة بالدولار ($)<input name="usd" type="number" step="0.01"></label><label>إجمالي التكلفة ($)<input name="tot" type="number" step="0.01"></label><label>سعر البيع<input name="price" type="number" step="0.01" required></label><label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>المدفوع ($)<input name="paid" type="number" step="0.01"></label><label>الدين يدويًا ($)<input name="debt" type="number" step="0.01"></label><button class="go">✨ حفظ المنتج</button></form></div><div class="card"><h3>📦 قائمة المنتجات وحساب الأرباح (سعر الصرف الحالي: ${fmt(rate)})</h3>${table(['الكود','اسم المنتج','المقاس','اللون','المورد','التكلفة المحلية','سعر البيع','الربح التقديري','الكمية','الإجراءات'],rows,'لا توجد منتجات مسجلة.')}</div>`;
  },

  sale(){
    const rows=db.sales.slice(-40).reverse().map(s=>{
      const total=n(s.qty)*n(s.price),disc=n(s.discount),costT=n(s.cost)*n(s.qty),pr=saleProfit(s);
      const st=n(s.qty)<0?'<span class="low">↩️ مرتجع</span>':n(s.debt)>0?`<span class="low">آجل (دين: ${fmt(s.debt)})</span>`:disc>0?`<span class="ok">نقدي (خصم ${fmt(disc)})</span>`:'<span class="ok">نقدي</span>';
      return `<tr><td>${s.date}</td><td><b>${pname(prod(s.pid))}</b>${s.note?' ('+esc(s.note)+')':''}</td><td>${esc(s.cust||'-')}</td><td><b>${s.qty}</b></td><td>${fmt(total)}</td><td><b>${fmt(s.paid)}</b></td><td>${fmt(costT)}</td><td class="${pr>=0?'ok':'low'}"><b>${fmt(pr)}</b></td><td>${st}</td></tr>`;
    });
    return `<div class="card"><h3>🛍️ فاتورة بيع جديدة</h3>
      <div id="pinfo" class="box-highlight">اكتب كود أو اسم المنتج لعرض التكلفة والربح</div>
      <form onsubmit="addS(event)" oninput="slCalc(this,event)">
        <label>🏷️ اسم المنتج<input name="name" autocomplete="off" placeholder="اسم المنتج"></label>
        <label>🔢 كود المنتج<input name="code" autocomplete="off" placeholder="كود المنتج"></label>
        <label>سعر القطعة (قائمة)<input name="price" type="number" step="0.01" placeholder="السعر"></label>
        <label>الكمية المباعة<input name="qty" type="number" min="1" step="1" value="1"></label>
        <label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل / دين</option></select></label>
        <label>💰 المبلغ المدفوع الفعلي (إجمالي الفاتورة)<input name="paid" type="number" step="0.01" placeholder="فارغ = السعر كاملاً"></label>
        <label>اسم الزبون<input name="cust" placeholder="اسم الزبون"></label>
        <label>المبلغ المتبقي (الدين)<input name="debt" type="number" step="0.01" readonly></label>
        <button class="go" style="grid-column:1/-1">💾 إتمام وحفظ البيع</button>
      </form>
      <div id="productSearchList"></div>
    </div>
    <div class="card"><h3>📋 سجل المبيعات والعمليات</h3>${table(['التاريخ','المنتج / العملية','الزبون','الكمية','الإجمالي','المدفوع','التكلفة','الربح الصافي','الحالة'],rows,'لا توجد مبيعات مسجلة.')}</div>`;
  },

  buy(){
    const rows=db.purchases.filter(p=>p.sid!==undefined).slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td><b>${pname(prod(s.pid))}</b></td><td>${supName(s.sid)}</td><td><b>${s.qty}</b></td><td>${fmt(s.costUsd||0)} $</td><td>${fmt(s.paid||0)} $</td><td><span class="${n(s.debt)>0?'low':''}">${fmt(s.debt||0)} $</span></td></tr>`);
    return `<div class="card"><h3>🛒 فاتورة شراء بضاعة</h3><form onsubmit="addB(event)" oninput="byCalc(this,event)"><label>كود المنتج<input name="code" autocomplete="off" placeholder="الكود"></label><label>اسم المنتج<input name="nm" autocomplete="off" placeholder="الاسم"></label><label>المورد<select name="sid">${supOpts('')}</select></label><label>الكمية<input name="qty" type="number" min="1" step="1" value="1"></label><label>سعر القطعة ($)<input name="usd" type="number" step="0.01"></label><label>الإجمالي ($)<input name="tot" type="number" step="0.01"></label><label>نوع الدفع<select name="mode"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>المدفوع ($)<input name="paid" type="number" step="0.01"></label><label>الدين للمورد ($)<input name="debt" type="number" step="0.01"></label><button class="go">💾 حفظ الشراء</button></form><div id="pinfo" style="margin-top:8px"></div></div><div class="card"><h3>📦 سجل المشتريات</h3>${table(['التاريخ','المنتج','المورد','الكمية','التكلفة','المدفوع','الدين'],rows,'لا توجد مشتريات.')}</div>`;
  },

  rs(){
    return `<div class="card"><h3>🔄 مرتجع أو تبديل منتج</h3>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <button class="go" style="${rsType==='return'?'':'background:#aaa'}" onclick="setRsType('return')">↩️ مرتجع (إرجاع واسترداد)</button>
        <button class="go" style="${rsType==='exchange'?'':'background:#aaa'}" onclick="setRsType('exchange')">🔄 تبديل قطعتين</button>
      </div>
      ${rsType==='return'?`
        <form onsubmit="addReturn(event)" oninput="rsSearchInput(this)">
          <div style="grid-column:1/-1" class="box-highlight"><b>↩️ بيانات القطعة المرجعة:</b></div>
          <label>كود أو اسم المنتج المرجع<input name="code" autocomplete="off" required placeholder="الكود أو الاسم"></label>
          <label>الكمية المرجعة<input name="qty" type="number" min="1" value="1" required></label>
          <label>المبلغ المسترد للزبون<input name="amt" type="number" step="0.01" required placeholder="المبلغ المُعاد"></label>
          <button class="go" style="grid-column:1/-1">💾 حفظ المرتجع وخصمه من المبيعات</button>
        </form>`:`
        <form onsubmit="addExchange(event)" oninput="rsExSearchInput(this)">
          <div style="grid-column:1/-1" class="box-highlight"><b>↩️ 1. القطعة المرجعة (تُعاد للمخزون):</b></div>
          <label>كود أو اسم المنتج المرجع<input name="oldCode" autocomplete="off" required placeholder="كود أو اسم القطعة المرجعة"></label>
          <label>الكمية المرجعة<input name="oldQty" type="number" min="1" value="1" required></label>
          <div style="grid-column:1/-1" class="box-highlight"><b>🆕 2. القطعة الجديدة (تُخصم من المخزون):</b></div>
          <label>كود أو اسم المنتج الجديد<input name="newCode" autocomplete="off" required placeholder="كود أو اسم القطعة الجديدة"></label>
          <label>الكمية الجديدة<input name="newQty" type="number" min="1" value="1" required></label>
          <div style="grid-column:1/-1" class="box-highlight"><b>💵 3. الفرق المالي:</b></div>
          <label>المبلغ (+ دفع الزبون زيادة / − استرد الزبون)<input name="amtDiff" type="number" step="0.01" required value="0"></label>
          <label>اسم الزبون<input name="cust" placeholder="اختياري"></label>
          <button class="go" style="grid-column:1/-1">💾 إتمام التبديل وتسجيله في المبيعات</button>
        </form>`}
      <div id="pinfo" style="margin-top:10px"></div>
    </div>`;
  },

  jard(){
    const list=db.products.filter(p=>!jardFilter||p.supId===jardFilter);
    const rows=list.map(p=>`<tr><td><code>${esc(p.code)}</code></td><td><b>${esc(p.name)}</b></td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${supName(p.supId)}</td><td class="${n(p.qty)<=2?'low':''}"><b>${p.qty}</b></td><td>${fmt(pc(p)*n(p.qty))}</td><td>${fmt(n(p.price)*n(p.qty))}</td></tr>`);
    const q=list.reduce((a,p)=>a+n(p.qty),0),cv=list.reduce((a,p)=>a+pc(p)*n(p.qty),0),sv=list.reduce((a,p)=>a+n(p.price)*n(p.qty),0);
    return `<div class="card"><h3>📦 الجرد والمخزون</h3><label style="margin-bottom:10px">تصفية حسب المورد<select onchange="jardF(this.value)">${supOpts(jardFilter).replace('بدون مورد','كل الموردين')}</select></label>
      <div class="kpi"><div><b>${q}</b><span>عدد القطع</span></div><div><b>${fmt(cv)}</b><span>قيمة المخزون (تكلفة)</span></div><div><b>${fmt(sv)}</b><span>قيمة المخزون (بيع)</span></div></div>
      ${table(['الكود','المنتج','المقاس','اللون','المورد','الكمية','قيمة التكلفة','قيمة البيع'],rows,'لا توجد منتجات.')}</div>`;
  },

  sup(){
    const M=supplierDebtMap();
    const rows=db.suppliers.map(s=>{const x=M[s.id]||{due:0,pay:0},r=x.due-x.pay;return `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.phone||'')}</td><td>${fmt(x.due)} $</td><td>${fmt(x.pay)} $</td><td class="${r>0.005?'low':'ok'}">${fmt(r)} $</td><td><button class="sm" onclick="selS('${s.id}')">📦 مخزونه</button></td></tr>`});
    const st=selSup?db.products.filter(p=>p.supId===selSup).map(p=>`<tr><td><code>${esc(p.code)}</code></td><td>${esc(p.name)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td><b>${p.qty}</b></td></tr>`):[];
    return `<div class="card"><h3>➕ إضافة مورد</h3><form onsubmit="addSup(event)"><label>الاسم<input name="name" required></label><label>الهاتف<input name="phone"></label><button class="go">💾 حفظ</button></form></div>
      <div class="card"><h3>💵 دفعة لمورد ($)</h3><form onsubmit="paySup(event)"><label>المورد<select name="sid" required>${supOpts('').replace('بدون مورد','اختر')}</select></label><label>المبلغ ($)<input name="amt" type="number" step="0.01" required></label><button class="go">💾 تسجيل الدفعة</button></form></div>
      <div class="card"><h3>👥 الموردون</h3>${table(['المورد','الهاتف','المستحق','المدفوع','المتبقي','مخزون'],rows,'لا يوجد موردون.')}</div>
      ${selSup?`<div class="card"><h3>📦 مخزون ${supName(selSup)}</h3>${table(['الكود','المنتج','المقاس','اللون','الكمية'],st,'لا يوجد مخزون.')}</div>`:''}`;
  },

  exp(){
    const rows=db.expenses.slice().reverse().slice(0,50).map(x=>`<tr><td>${x.date}</td><td>${esc(x.desc)}</td><td>${fmt(x.amt)}</td><td><button class="sm" onclick="delExp('${x.id}')" style="color:var(--bad)">🗑️</button></td></tr>`);
    return `<div class="card"><h3>💸 إضافة مصروف</h3><form onsubmit="addExp(event)"><label>البيان<input name="desc" required></label><label>المبلغ<input name="amt" type="number" step="0.01" required></label><label>التاريخ<input name="date" type="date" value="${today()}" required></label><button class="go">💾 حفظ</button></form></div><div class="card"><h3>📋 المصاريف</h3>${table(['التاريخ','البيان','المبلغ',''],rows,'لا توجد مصاريف.')}</div>`;
  },

  debt(){
    const Cd=custData();
    const list=Object.entries(Cd).filter(([,c])=>Math.abs(c.rem)>0.005);
    const rows=list.map(([nm,c])=>`<tr><td><b>${esc(nm)}</b></td><td>${fmt(c.due+c.extraDebt)}</td><td>${fmt(c.pay)}</td><td class="${c.rem>0?'low':'ok'}">${fmt(c.rem)}</td></tr>`);
    return `<div class="card"><h3>💵 تسجيل دفعة / دين سابق</h3><form onsubmit="addPay(event)"><label>الزبون<input name="cust" list="cl" required autocomplete="off"><datalist id="cl">${Object.keys(Cd).map(k=>`<option value="${esc(k)}">`).join('')}</datalist></label><label>النوع<select name="kind"><option value="pay">دفعة من الزبون</option><option value="debt">دين سابق</option></select></label><label>المبلغ<input name="amt" type="number" step="0.01" required></label><button class="go">💾 حفظ</button></form></div><div class="card"><h3>📋 ديون الزبائن</h3>${table(['الزبون','إجمالي الدين','المدفوع','المتبقي'],rows,'لا توجد ديون.')}</div>`;
  },

  rep(){
    const d=rptD||today(),m=d.slice(0,7);
    const blk=(title,key)=>{
      const f=x=>(x.date||'').startsWith(key),S=db.sales.filter(f),E=db.expenses.filter(f);
      const cnt=S.filter(s=>n(s.qty)>0).length,net=S.reduce((a,s)=>a+saleNet(s),0),pr=S.reduce((a,s)=>a+saleProfit(s),0);
      const cash=S.reduce((a,s)=>a+n(s.paid),0),ret=S.filter(s=>n(s.qty)<0).reduce((a,s)=>a+Math.abs(n(s.paid)),0);
      const disc=S.reduce((a,s)=>a+n(s.discount),0),ex=E.reduce((a,x)=>a+n(x.amt),0);
      return `<div class="card"><h3>${title}</h3><div class="kpi">
        <div><b>${cnt}</b><span>عدد عمليات البيع</span></div>
        <div><b>${fmt(net)}</b><span>صافي المبيعات (بعد المرتجع والخصم)</span></div>
        <div><b>${fmt(cash)}</b><span>صافي المقبوض</span></div>
        <div><b>${fmt(ret)}</b><span>مرتجعات مخصومة</span></div>
        <div><b>${fmt(disc)}</b><span>خصومات</span></div>
        <div><b class="${pr>=0?'ok':'low'}">${fmt(pr)}</b><span>ربح المبيعات</span></div>
        <div><b>${fmt(ex)}</b><span>المصاريف</span></div>
        <div><b class="${pr-ex>=0?'ok':'low'}">${fmt(pr-ex)}</b><span>صافي الربح بعد المصاريف</span></div></div></div>`;
    };
    return `<div class="card"><label>التاريخ<input type="date" value="${d}" onchange="setRptDate(this.value)"></label></div>${blk('📅 تقرير يوم '+d,d)}${blk('🗓️ تقرير شهر '+m,m)}`;
  },

  acct(){
    return `<div class="card"><h3>⚙️ الحساب</h3><p>${esc(auth.currentUser?.email||'')}</p><button class="go" onclick="logout()">🚪 تسجيل الخروج</button></div>`;
  }
};

/* ===== الدوال ===== */
const W=(o)=>Object.assign(window,o);
W({
  go(k){tab=k;render()},
  async login(e){e.preventDefault();const f=e.target;try{await signInWithEmailAndPassword(auth,f.email.value,f.pw.value)}catch{toast('⚠️ بيانات الدخول غير صحيحة')}},
  logout(){signOut(auth)},
  async setRate(e){e.preventDefault();const r=n(e.target.r.value);if(r<=0)return toast('⚠️ أدخل سعراً صحيحاً');const b=writeBatch(fs);put(b,'rates',{date:today(),rate:r});await b.commit();toast('✅ تم حفظ سعر الصرف')},
  setRsType(t){rsType=t;render()},
  jardF(v){jardFilter=v;render()},
  selS(id){selSup=id;render()},
  setRptDate(v){rptD=v;render()},

  async addP(e){
    e.preventDefault();const f=e.target,q=n(f.qty.value)||1;
    const usd=n(f.usd.value)||(n(f.tot.value)/q)||0,mode=f.mode.value,total=usd*q;
    const paid=f.paid.value===''?(mode==='cash'?total:0):n(f.paid.value);
    const debt=f.debt.value!==''?n(f.debt.value):(mode==='credit'?Math.max(0,total-paid):0);
    const code=f.code.value.trim(),size=f.size.value.trim(),color=f.color.value.trim();
    if(db.products.some(p=>(p.code||'').toLowerCase()===code.toLowerCase()&&(p.size||'')===size&&(p.color||'')===color))return toast('⚠️ المنتج موجود مسبقاً');
    const b=writeBatch(fs),ref=doc(C('products'));
    b.set(ref,{code,name:f.name.value.trim(),size,color,supId:f.sid.value,qty:q,costUsd:usd,price:n(f.price.value),ts:Date.now()});
    if(usd>0)put(b,'purchases',{pid:ref.id,sid:f.sid.value,qty:q,costUsd:usd,paid,debt,date:today()});
    await b.commit();f.reset();toast('✅ تم حفظ المنتج');
  },
  async upP(id){
    const p=prod(id);if(!p)return;
    const nm=prompt('اسم المنتج',p.name);if(nm===null)return;
    const pr=prompt('سعر البيع',p.price);if(pr===null)return;
    const q=prompt('الكمية',p.qty);if(q===null)return;
    const b=writeBatch(fs);b.update(D('products',id),{name:nm.trim()||p.name,price:n(pr),qty:n(q)});await b.commit();toast('✅ تم التعديل');
  },
  async delP(id){if(!confirm('حذف المنتج؟'))return;const b=writeBatch(fs);b.delete(D('products',id));await b.commit()},

  byCalc(f,e){
    const q=n(f.qty.value)||1,t=e&&e.target.name;
    if(t==='usd')f.tot.value=f.usd.value?(n(f.usd.value)*q).toFixed(2):'';
    else if(t==='tot'||t==='qty'){if(f.tot.value&&t==='tot')f.usd.value=(n(f.tot.value)/q).toFixed(2);else if(f.usd.value)f.tot.value=(n(f.usd.value)*q).toFixed(2)}
    const total=n(f.tot.value),paid=f.paid.value===''?(f.mode.value==='cash'?total:0):n(f.paid.value);
    f.debt.value=f.mode.value==='credit'&&total-paid>0?(total-paid).toFixed(2):'';
    $('#pinfo').innerHTML=pinfo(f.code.value,f.nm.value);
  },
  async addB(e){
    e.preventDefault();const f=e.target,p=findP(f.code.value,f.nm.value);
    if(!p)return toast('⚠️ المنتج غير موجود');
    const q=n(f.qty.value)||1,usd=n(f.usd.value)||(n(f.tot.value)/q);
    if(!usd)return toast('⚠️ أدخل التكلفة');
    const total=usd*q,paid=f.paid.value===''?(f.mode.value==='cash'?total:0):n(f.paid.value);
    const debt=f.mode.value==='credit'?Math.max(0,total-paid):0;
    const oldQ=Math.max(0,n(p.qty)),avg=(oldQ*n(p.costUsd)+q*usd)/(oldQ+q); // متوسط مرجّح للتكلفة
    const b=writeBatch(fs);
    put(b,'purchases',{pid:p.id,sid:f.sid.value,qty:q,costUsd:usd,paid,debt,date:today()});
    b.update(D('products',p.id),{qty:increment(q),costUsd:avg});
    await b.commit();f.reset();toast('✅ تم حفظ الشراء');
  },

  fillProductFromSuggestion(id){
    const p=prod(id),f=document.querySelector('form[onsubmit^="addS"]');if(!p||!f)return;
    f.code.value=p.code;f.name.value=p.name;f.price.value=p.price;slCalc(f,{target:{name:''}});
  },
  slCalc(f,e){
    const p=findP(f.code.value,f.name.value),box=$('#pinfo');
    if(!p){box.innerHTML='اكتب كود أو اسم المنتج لعرض التكلفة والربح';f.debt.value='';renderProductSuggestions(f,f.name.value||f.code.value);return}
    if(e&&(e.target.name==='code'||e.target.name==='name')&&!n(f.price.value))f.price.value=p.price;
    renderProductSuggestions(f,f.name.value||f.code.value);
    const rate=curRate(),cost=pc(p),price=n(f.price.value)||n(p.price),q=n(f.qty.value)||1;
    const total=price*q,mode=f.mode.value;
    const paid=f.paid.value===''?(mode==='cash'?total:0):n(f.paid.value);
    const disc=mode==='cash'?Math.max(0,total-paid):0,debt=mode==='credit'?Math.max(0,total-paid):0;
    f.debt.value=debt?debt.toFixed(2):'';
    const ppc=price-cost,real=(total-disc)-cost*q;
    box.innerHTML=`<b>${esc(p.name)}</b> — المتوفر: <b>${p.qty}</b><br>💱 سعر الصرف: <b>${fmt(rate)}</b> | تكلفة القطعة: <b>${p.costUsd?fmt(p.costUsd)+'$ ← ':''}${fmt(cost)}</b>${rate?'':' <span class="low">(أدخل سعر الصرف!)</span>'}<br>💵 ربح القطعة بسعر القائمة: <b class="${ppc>=0?'ok':'low'}">${fmt(ppc)}</b>${cost>0?' ('+(ppc/cost*100).toFixed(1)+'%)':''}<br>🧾 ربح الفاتورة الفعلي${disc?' بعد الخصم '+fmt(disc):''}: <b class="${real>=0?'ok':'low'}">${fmt(real)}</b>`;
  },
  async addS(e){
    e.preventDefault();const f=e.target,p=findP(f.code.value,f.name.value);
    if(!p)return toast('⚠️ المنتج غير موجود');
    const q=n(f.qty.value)||1;
    if(q>n(p.qty))return toast('⚠️ المتوفر فقط '+p.qty);
    const price=n(f.price.value)||n(p.price),total=price*q,mode=f.mode.value;
    let paid=f.paid.value===''?(mode==='cash'?total:0):n(f.paid.value);
    if(paid>total)paid=total;
    const discount=mode==='cash'?Math.max(0,total-paid):0,debt=mode==='credit'?Math.max(0,total-paid):0,cust=f.cust.value.trim();
    if(debt>0&&!cust)return toast('⚠️ اكتب اسم الزبون للبيع الآجل');
    const b=writeBatch(fs);
    put(b,'sales',{type:'sale',pid:p.id,date:today(),qty:q,price,paid,discount,debt,cost:pc(p),cust});
    b.update(D('products',p.id),{qty:increment(-q)});
    await b.commit();f.reset();$('#pinfo').innerHTML='اكتب كود أو اسم المنتج لعرض التكلفة والربح';toast('✅ تم حفظ البيع');
  },

  rsSearchInput(f){$('#pinfo').innerHTML=pinfo(f.code.value,f.code.value)},
  rsExSearchInput(f){$('#pinfo').innerHTML=pinfo(f.oldCode.value,f.oldCode.value)+pinfo(f.newCode.value,f.newCode.value)},
  async addReturn(e){
    e.preventDefault();const f=e.target,p=findP(f.code.value,f.code.value);
    if(!p)return toast('⚠️ المنتج غير موجود');
    const q=n(f.qty.value)||1,amt=n(f.amt.value);
    const b=writeBatch(fs);
    put(b,'sales',{type:'return',note:'مرتجع',pid:p.id,date:today(),qty:-q,price:amt/q,paid:-amt,discount:0,debt:0,cost:pc(p),cust:''});
    b.update(D('products',p.id),{qty:increment(q)});
    await b.commit();f.reset();toast('✅ تم المرتجع');
  },
  async addExchange(e){
    e.preventDefault();const f=e.target;
    const o=findP(f.oldCode.value,f.oldCode.value),nw=findP(f.newCode.value,f.newCode.value);
    if(!o||!nw)return toast('⚠️ تحقق من المنتجين');
    const oq=n(f.oldQty.value)||1,nq=n(f.newQty.value)||1,diff=n(f.amtDiff.value);
    if(nq>n(nw.qty)+(o.id===nw.id?oq:0))return toast('⚠️ المتوفر من الجديد '+nw.qty);
    const oldVal=n(o.price)*oq,newPaid=oldVal+diff,cust=f.cust.value.trim(),d=today();
    const b=writeBatch(fs);
    put(b,'sales',{type:'return',note:'تبديل – مرجع',pid:o.id,date:d,qty:-oq,price:n(o.price),paid:-oldVal,discount:0,debt:0,cost:pc(o),cust});
    put(b,'sales',{type:'sale',note:'تبديل – جديد',pid:nw.id,date:d,qty:nq,price:newPaid/nq,paid:newPaid,discount:0,debt:0,cost:pc(nw),cust});
    b.update(D('products',o.id),{qty:increment(oq-(o.id===nw.id?nq:0))});
    if(o.id!==nw.id)b.update(D('products',nw.id),{qty:increment(-nq)});
    await b.commit();f.reset();toast('✅ تم التبديل');
  },

  async addSup(e){e.preventDefault();const f=e.target,b=writeBatch(fs);put(b,'suppliers',{name:f.name.value.trim(),phone:f.phone.value.trim()});await b.commit();f.reset()},
  async paySup(e){e.preventDefault();const f=e.target,b=writeBatch(fs);put(b,'spay',{sid:f.sid.value,amt:n(f.amt.value),date:today()});await b.commit();f.reset();toast('✅ تم')},
  async addExp(e){e.preventDefault();const f=e.target,b=writeBatch(fs);put(b,'expenses',{desc:f.desc.value.trim(),amt:n(f.amt.value),date:f.date.value});await b.commit();f.reset();toast('✅ تم')},
  async delExp(id){if(!confirm('حذف المصروف؟'))return;const b=writeBatch(fs);b.delete(D('expenses',id));await b.commit()},
  async addPay(e){e.preventDefault();const f=e.target,b=writeBatch(fs);put(b,'pay',{cust:f.cust.value.trim(),kind:f.kind.value,amt:n(f.amt.value),date:today()});await b.commit();f.reset();toast('✅ تم')}
});
</script>
</body>
