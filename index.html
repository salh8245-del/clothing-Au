<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b8cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة Au Clothing</title>
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#3b2430;--mute:#8a6b78;--main:#f6b8cc;--acc:#e07a9c;--line:#f0d3dd;--bad:#c0392b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:var(--main);padding:14px 16px;font-size:20px;font-weight:700}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
nav button{flex:1;min-width:92px;padding:12px 8px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#a8325a;border-color:var(--acc);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;background:#fffafc;color:var(--ink);font:inherit;width:100%}
button.go{background:var(--main);color:var(--ink);border:1px solid var(--acc);border-radius:6px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;align-self:end}
button.sm{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.low{color:var(--bad);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--mute)}
.net{border-right:5px solid var(--acc)!important}
.empty{color:var(--mute);padding:8px 0;margin:0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<header>برنامج محاسبة لمحل Au Clothing</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp(firebaseConfig);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns','suppliers','spay','rates','loans','closes'];
const EMPTY=()=>Object.fromEntries(NAMES.map(k=>[k,[]]));
let uid=null,unsubs=[],loaded=false,tab='products',tab_m='',tab_d='',repMode='day',rmMode='ret',selSup='',selCust='',selSale='',selProd='',prodQ='',lowOnly=false,selPur='',cashD='',selRet='';
let db=EMPTY();
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)}`:'(محذوف)';
const popts=()=>db.products.map(p=>`<option value="${p.id}">${pname(p)} (${p.qty})</option>`).join('');
const tabs={products:'المنتجات',sale:'بيع',buy:'شراء',rs:'مرتجع / تبديل',sup:'الموردين',exp:'المصاريف',debt:'الديون',cash:'الصندوق',rep:'التقارير',acct:'الحساب'};
function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;
  if(u){uid=u.uid;let got=0;
    NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),s=>{
      db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));
      if(++got>=NAMES.length)loaded=true;
      if(loaded)render()
    },e=>toast('خطأ في القراءة: '+e.code))));
  }else{uid=null;db=EMPTY()}
  render();
});

function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">جارٍ تحميل البيانات...</div>';
  $('#app').innerHTML=banner()+views[tab]();
}

const curRate=()=>{const r=db.rates.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):0};
const pc=p=>p.costUsd?p.costUsd*curRate():n(p.cost);
const banner=()=>{const ok=db.rates.some(x=>x.date===today()),r=curRate();return `<div class="card"><form onsubmit="setRate(event)"><label>${ok?'سعر صرف اليوم':'أدخل سعر صرف اليوم'} (ل.س لكل $)${!ok&&r?' — آخر سعر: '+fmt(r):''}<input name="r" type="number" step="any" min="0" required value="${ok?r:''}"></label><button class="go">حفظ سعر اليوم</button></form></div>${lowBanner()}`};
const finds=c=>{c=(c||'').trim().toLowerCase();if(!c)return[];let x=db.products.filter(p=>(p.code||'').toLowerCase()===c);if(x.length)return x;x=db.products.filter(p=>p.name.toLowerCase()===c);if(x.length)return x;return db.products.filter(p=>p.name.toLowerCase().includes(c)||(p.code||'').toLowerCase().includes(c))};
const findP=c=>{const L=finds(c);return L.length===1?L[0]:null};
const pn2=p=>p?`${esc(p.name)} (${esc(p.code||'-')})`:'(محذوف)';
const totUsd=(f,q)=>n(f.tot.value)>0?n(f.tot.value):q*n(f.usd.value);
const payUsd=(f,t)=>f.mode.value==='cash'?t:Math.min(n(f.paid.value),t);
function custData(){const C={};
 const inv=[...db.sales.filter(s=>s.cust&&s.qty*s.price-s.paid>0.005),...db.loans.map(l=>({id:l.id,date:l.date,ts:l.ts,cust:l.name,qty:1,price:l.amt,paid:0,loan:true,note:l.note}))];
 inv.forEach(s=>{(C[s.cust]=C[s.cust]||{inv:[],pool:0}).inv.push(s)});
 db.pay.forEach(p=>{if(C[p.cust])C[p.cust].pool+=p.amt});db.returns.forEach(r=>{if(r.cust&&C[r.cust])C[r.cust].pool+=r.value-r.refund});
 Object.values(C).forEach(c=>{let pool=c.pool;c.inv=c.inv.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).map(s=>{const owe=s.qty*s.price-s.paid,t=Math.min(owe,Math.max(pool,0));pool-=t;return{s,owe,rem:owe-t}});c.rem=c.inv.reduce((a,i)=>a+i.rem,0)});return C}
const pinfo=c=>{if(!(c||'').trim())return '';const L=finds(c);return !L.length?'لا يوجد منتج مطابق':L.length===1?`✓ ${pname(L[0])} | المتوفر: ${L[0].qty}`:'عدة منتجات، اكتب الكود: '+L.slice(0,6).map(p=>`${esc(p.code||'-')} (${pname(p)})`).join('، ')};
const supOpts=v=>'<option value="">بدون مورد</option>'+db.suppliers.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${esc(s.name)}</option>`).join('');
const supName=id=>{const s=db.suppliers.find(x=>x.id===id);return s?esc(s.name):'-'};
const supDebt=id=>db.purchases.filter(p=>p.sid===id).reduce((a,p)=>a+p.qty*p.costUsd-p.paid,0)-db.spay.filter(p=>p.sid===id).reduce((a,p)=>a+p.amt,0);
const left=s=>s.qty-db.returns.filter(r=>r.saleId===s.id).reduce((a,r)=>a+r.qty,0);
const saleOf=id=>db.sales.find(s=>s.id===id);
const sopts=(c,cu)=>{const p=findP(c),k=(cu||'').trim().toLowerCase();return db.sales.filter(s=>left(s)>0&&(!p||s.pid===p.id)&&(!k||(s.cust||'').toLowerCase().includes(k))).slice(-60).reverse().map(s=>`<option value="${s.id}">${s.date} | ${pn2(prod(s.pid))} | ${esc(s.cust||'نقدي')} | متبقي ${left(s)} | ${fmt(s.price)}</option>`).join('')};
function summ(S,R,E){const g=S.reduce((a,s)=>a+s.qty*s.price,0),rv=R.reduce((a,r)=>a+r.value,0),c=S.reduce((a,s)=>a+s.qty*s.cost,0)-R.filter(r=>!r.damaged).reduce((a,r)=>a+r.qty*r.cost,0),ex=E.filter(e=>!e.wd).reduce((a,e)=>a+e.amt,0),wd=E.filter(e=>e.wd).reduce((a,e)=>a+e.amt,0),net=g-rv,pr=net-c;return{cnt:S.filter(s=>!s.swap).length,net,rv,c,pr,ex,wd,fin:pr-ex,aft:pr-ex-wd}}
const kpi=(o,extra='')=>`<div class="kpi"><div><span>عدد الفواتير</span><b>${o.cnt}</b></div><div><span>المبيعات (بعد المرتجع)</span><b>${fmt(o.net)}</b></div><div><span>المرتجعات</span><b>${fmt(o.rv)}</b></div><div><span>تكلفة البضاعة</span><b>${fmt(o.c)}</b></div><div><span>مجمل الربح</span><b>${fmt(o.pr)}</b></div><div><span>المصاريف</span><b>${fmt(o.ex)}</b></div><div><span>صافي الربح</span><b class="${o.fin<0?'low':''}">${fmt(o.fin)}</b></div><div><span>المسحوبات من الأرباح</span><b>${fmt(o.wd)}</b></div><div class="net"><span>الربح بعد السحب</span><b class="${o.aft<0?'low':''}">${fmt(o.aft)}</b></div>${extra}</div>`;
const tog=(a,b,cur,fa,fb)=>`<button class="${cur===a[0]?'go':'sm'}" onclick="${fa}('${a[0]}')">${a[1]}</button> <button class="${cur===b[0]?'go':'sm'}" onclick="${fa}('${b[0]}')">${b[1]}</button>`;

const rateAt=d=>{const r=db.rates.filter(x=>x.date<=d).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):curRate()};
const pcAt=(p,d)=>p.costUsd?p.costUsd*rateAt(d):n(p.cost);
const getLow=()=>{try{const v=localStorage.getItem('low');return v===null?2:n(v)}catch(e){return 2}};
const lowBanner=()=>{const k=db.products.filter(p=>p.qty<=getLow()).length;return k?`<div class="card"><b class="low">⚠ منتجات ناقصة: ${k}</b> <button class="sm" onclick="goLow()">عرض</button></div>`:''};
const cashOf=d=>{const S=db.sales.filter(s=>s.date===d),R=db.returns.filter(r=>r.date===d),E=db.expenses.filter(e=>e.date===d);
 const sales=S.reduce((a,s)=>a+s.paid,0),pay=db.pay.filter(p=>p.date===d).reduce((a,p)=>a+p.amt,0),ref=R.reduce((a,r)=>a+(r.swap?r.value:r.refund),0),ex=E.filter(e=>!e.wd).reduce((a,e)=>a+e.amt,0),wd=E.filter(e=>e.wd).reduce((a,e)=>a+e.amt,0),loan=db.loans.filter(l=>l.date===d).reduce((a,l)=>a+l.amt,0);
 return{sales,pay,ref,ex,wd,loan,net:sales+pay-ref-ex-wd-loan}};
const lastClose=d=>db.closes.filter(c=>c.date<d).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();
const closeOf=d=>db.closes.filter(c=>c.date===d).sort((a,b)=>(a.ts||0)-(b.ts||0)).pop();
const prodTable=()=>{const q=prodQ.trim().toLowerCase();const L=db.products.filter(p=>(!q||(p.code||'').toLowerCase().includes(q)||p.name.toLowerCase().includes(q))&&(!lowOnly||p.qty<=getLow()));if(lowOnly)L.sort((a,b)=>a.qty-b.qty);
 return table(['الكود','الاسم','المقاس','اللون','المورد','شراء $','التكلفة ل.س (اليوم)','البيع','الربح/قطعة','الكمية',''],L.map(p=>{const c=pc(p);return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${supName(p.supId)}</td><td>${p.costUsd?fmt(p.costUsd)+' $':'-'}</td><td>${fmt(c)}</td><td>${fmt(p.price)}</td><td>${fmt(p.price-c)}</td><td class="${p.qty<=getLow()?'low':''}">${p.qty}</td><td><button class="sm" onclick="setProd('${p.id}')">تعديل</button> <button class="sm" onclick="delP('${p.id}')">حذف</button></td></tr>`}),'لا توجد منتجات مطابقة.')};
const views={
login(){return `<div class="card"><h3>تسجيل الدخول</h3><form onsubmit="login(event)"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="username"></label><label>كلمة المرور<input name="pw" type="password" required autocomplete="current-password"></label><button class="go">دخول</button></form></div>`},
products(){
 const ep=prod(selProd);
 const edit=ep?`<div class="card"><h3>تعديل المنتج</h3><form onsubmit="saveProd(event)">
 <label>الكود<input name="code" value="${esc(ep.code)}"></label><label>الاسم<input name="name" required value="${esc(ep.name)}"></label><label>المقاس<input name="size" value="${esc(ep.size)}"></label><label>اللون<input name="color" value="${esc(ep.color)}"></label>
 <label>المورد<select name="sid">${supOpts(ep.supId||'')}</select></label><label>سعر الشراء بالدولار $<input name="usd" type="number" step="any" min="0" value="${ep.costUsd||''}"></label>
 <label>سعر البيع بالسوري<input name="price" type="number" step="any" min="0" required value="${ep.price}"></label><label>الكمية في المخزون<input name="qty" type="number" min="0" value="${ep.qty}"></label>
 <button class="go">حفظ التعديل</button> <button type="button" class="sm" onclick="cancelEdit()">إلغاء</button></form></div>`:'';
 return `${edit}<div class="card"><h3>إضافة منتج (فاتورة شراء أولى)</h3><form onsubmit="addP(event)">
 <label>الكود<input name="code" required></label><label>اسم المنتج<input name="name" required></label><label>المقاس<input name="size"></label><label>اللون<input name="color"></label>
 <label>المورد<select name="sid">${supOpts('')}</select></label><label>سعر القطعة بالدولار $<input name="usd" type="number" step="any" min="0"></label><label>أو إجمالي الفاتورة بالدولار $<input name="tot" type="number" step="any" min="0"></label>
 <label>سعر البيع بالسوري<input name="price" type="number" step="any" min="0" required></label><label>الكمية<input name="qty" type="number" min="0" value="0"></label>
 <label>طريقة الدفع<select name="mode"><option value="cash">كاش (دفعت كامل)</option><option value="credit">دين على المورد</option></select></label><label>المدفوع الآن بالدولار (للدين فقط، فارغ = 0)<input name="paid" type="number" step="any" min="0"></label><button class="go">إضافة المنتج</button></form></div>
 <div class="card"><h3>المخزون (${db.products.length})</h3><form onsubmit="return false" style="margin-bottom:8px"><label>بحث بالكود أو الاسم<input value="${esc(prodQ)}" oninput="psearch(this.value)" autocomplete="off"></label><label>تنبيه النقص عند كمية ≤<input type="number" min="0" value="${getLow()}" onchange="setLow(this.value)"></label><button type="button" class="${lowOnly?'go':'sm'}" onclick="togLow()">الناقصة فقط</button></form><div id="ptab">${prodTable()}</div></div>`},
sale(){
 const s0=selSale?saleOf(selSale):null;
 const edit=s0?`<div class="card"><h3>تعديل فاتورة ${s0.date} — ${pn2(prod(s0.pid))}</h3><form onsubmit="saveSale(event)">
 <label>تاريخ الفاتورة<input name="date" type="date" value="${s0.date}"></label><label>الكمية<input name="qty" type="number" min="1" required value="${s0.qty}"></label><label>سعر القطعة<input name="price" type="number" step="any" min="0" required value="${s0.price}"></label>
 <label>اسم الزبون<input name="cust" value="${esc(s0.cust)}"></label><label>المدفوع (إن غيّرت الكمية أو السعر عدّل هذا أيضاً)<input name="paid" type="number" step="any" min="0" value="${s0.paid}"></label>
 <button class="go">حفظ التعديل</button> <button type="button" class="sm" onclick="cancelEdit()">إلغاء</button> <button type="button" class="sm" onclick="delSale()">إلغاء الفاتورة</button></form></div>`:'';
 const L=[...db.sales.map(s=>({k:'s',d:s.date,t:s.ts||0,s})),...db.pay.map(p=>({k:'p',d:p.date,t:p.ts||0,p}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t-b.t).slice(-30).reverse();
 const rows=L.map(x=>{if(x.k==='p')return `<tr><td>${x.d}</td><td>سداد دين</td><td>-</td><td>${fmt(x.p.amt)}</td><td>-</td><td>${esc(x.p.cust)}</td><td>${fmt(x.p.amt)}</td><td></td></tr>`;
  const s=x.s,dc=s.list>s.price?(s.list-s.price)*s.qty:0;return `<tr><td>${s.date}</td><td>${pn2(prod(s.pid))}${s.swap?' (تبديل)':''}</td><td>${s.qty}</td><td>${fmt(s.qty*s.price)}</td><td>${dc?fmt(dc):'-'}</td><td>${esc(s.cust)}</td><td>${fmt(s.paid)}</td><td>${s.swap?'':`<button class="sm" onclick="setSale('${s.id}')">تعديل</button>`}</td></tr>`});
 return `${edit}<div class="card"><h3>فاتورة بيع</h3><form onsubmit="addS(event)" oninput="slCalc(this,event)">
 <label>المنتج (اسم أو كود)<input name="code" autocomplete="off"></label>
 <label>الكمية<input name="qty" type="number" min="1" value="1" required></label><label>سعر القطعة (غيّره للخصم)<input name="price" type="number" step="any" min="0" required></label>
 <label>تاريخ الفاتورة<input name="date" type="date" value="${today()}"></label><label>طريقة الدفع<select name="mode"><option value="cash">نقداً (مدفوع كامل)</option><option value="credit">دين (آجل)</option></select></label>
 <label>اسم الزبون (إلزامي للدين)<input name="cust"></label><label>المدفوع الآن (للدين فقط، فارغ = 0)<input name="paid" type="number" step="any" min="0"></label><button class="go">تسجيل البيع</button></form>
 <p id="pinfo" class="empty"></p></div>
 <div class="card"><h3>سجل المبيعات</h3>${table(['التاريخ','المنتج','الكمية','الإجمالي','الخصم','الزبون','المدفوع',''],rows,'لا توجد مبيعات بعد.')}</div>`},
buy(){
 const ep=selPur?db.purchases.find(x=>x.id===selPur):null;
 const edit=ep?`<div class="card"><h3>تعديل فاتورة شراء ${ep.date} — ${pn2(prod(ep.pid))}</h3><form onsubmit="savePur(event)">
