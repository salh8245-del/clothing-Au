<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b8cc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة Au Clothing</title>
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#3b2430;--mute:#8a6b78;--main:#f6b8cc;--acc:#e07a9c;--line:#f0d3dd;--bad:#c0392b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:var(--main);padding:14px 16px;font-size:20px;font-weight:700}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
nav button{flex:1;min-width:92px;padding:12px 8px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#a8325a;border-color:var(--acc);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;background:#fffafc;color:var(--ink);font:inherit;width:100%}
button.go{background:var(--main);color:var(--ink);border:1px solid var(--acc);border-radius:6px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;align-self:end}
button.sm{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.low{color:var(--bad);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--mute)}
.net{border-right:5px solid var(--acc)!important}
.empty{color:var(--mute);padding:8px 0;margin:0}
.filterrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}.seasonbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.seasonbar strong{color:#8b3155}.seasonbar select{max-width:180px}.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<header>برنامج محاسبة لمحل Au Clothing <span id="sync" style="float:left;font-size:13px;font-weight:400"></span></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp(firebaseConfig);
const DBID=(()=>{try{const q=new URLSearchParams(location.search).get('db');if(q)localStorage.setItem('dbid',q==='reset'?'(default)':q);return localStorage.getItem('dbid')||'(default)'}catch(e){return '(default)'}})();
const fs=initializeFirestore(app,{experimentalAutoDetectLongPolling:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})},DBID);
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns','suppliers','spay','rates','loans','closes','credits','capital','settings'];
const EMPTY=()=>Object.fromEntries(NAMES.map(k=>[k,[]]));
let uid=null,unsubs=[],loaded=false,tab='products',repFrom='',repTo='',repMode='range',rmMode='ret',selSup='',selCust='',selSale='',selProd='',prodQ='',lowOnly=false,selPur='',cashD='',selRet='',selInv='',rsQ='',saleD='',rsD='',purQ='',invQ='',prodSeasonFilter='active',prodYearQ='',invSeasonFilter='active',invYearQ='';
let db=EMPTY();
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const dual=v=>`${fmt(v)} ل.س <small style="display:block;font-size:13px;font-weight:400;color:var(--mute)">${curRate()>0?fmt(n(v)/curRate())+' $':'الدولار: حدّد سعر الصرف'}</small>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pyear=p=>{const v=String(p?.year??p?.seasonYear??'').trim(),m=v.match(/(?:19|20)\d{2}/);return m?m[0]:v};
const pname=p=>p?`${esc(p.name)} (${esc(p.code||'-')})${pyear(p)?' — سنة '+esc(pyear(p)):''}`:'(محذوف)';
const popts=()=>db.products.filter(isActiveProduct).map(p=>`<option value="${p.id}">${pname(p)} (${p.qty})</option>`).join('');
const tabs={products:'المنتجات',inv:'المخزن',sale:'بيع',buy:'شراء',rs:'مرتجع / تبديل',sup:'الموردين',exp:'المصاريف',debt:'الديون',cash:'الصندوق',rep:'التقارير',acct:'الحساب'};
const seasonNames={winter:'شتوي',summer:'صيفي',shared:'مشترك بين الموسمين'};
const activeSeason=()=>{const c=db.settings.find(x=>x.id==='season_config');return c?.activeSeason||'winter'};
const seasonOf=p=>p.season||'shared';
const isActiveProduct=p=>!!p&&seasonOf(p)===activeSeason();
const seasonMatches=(p,f)=>f==='all'?['winter','summer'].includes(seasonOf(p)):(f==='active'?isActiveProduct(p):seasonOf(p)===f);
const seasonLabel=v=>seasonNames[v]||'مشترك';
const seasonSelect=(name,value)=>`<select name="${name}"><option value="winter"${value==='winter'?' selected':''}>شتوي</option><option value="summer"${value==='summer'?' selected':''}>صيفي</option><option value="shared"${value==='shared'?' selected':''}>مشترك بين الموسمين</option></select>`;
const locationSelect=(name,value)=>`<select name="${name}"><option value="store"${(value||'store')==='store'?' selected':''}>صالة البيع</option><option value="warehouse"${value==='warehouse'?' selected':''}>المخزن</option><option value="display"${value==='display'?' selected':''}>معروض</option></select>`;
function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}

let seen=new Set(),st={},serr='';
function setSync(){const el=$('#sync');if(!el)return;if(!uid){el.textContent='';return}const v=Object.values(st);
 el.textContent=serr?'🔴 خطأ: '+serr:v.length&&v.every(x=>x.c)?'🔴 بدون اتصال بالسيرفر (محفوظ على الجهاز)':v.some(x=>x.p)?'🟠 جارٍ رفع التعديلات':'🟢 متزامن'}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;seen=new Set();st={};serr='';
  if(u){uid=u.uid;
    NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),{includeMetadataChanges:true},s=>{
      st[k]={p:s.metadata.hasPendingWrites,c:s.metadata.fromCache};if(!s.metadata.fromCache)serr='';
      if(!seen.has(k)||s.docChanges().length){db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));seen.add(k);if(seen.size>=NAMES.length)loaded=true;if(loaded)render()}
      setSync()
    },e=>{serr=e.code||'error';setSync();toast('خطأ في القراءة: '+e.code)})));
  }else{uid=null;db=EMPTY()}
  render();setSync();
});

function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">جارٍ تحميل البيانات...</div>';
  $('#app').innerHTML=banner()+views[tab]();
}

const curRate=()=>{const r=db.rates.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):0};
const pc=p=>p.costUsd?p.costUsd*curRate():n(p.cost);
const banner=()=>{const ok=db.rates.some(x=>x.date===today()),r=curRate(),sea=activeSeason();return `<div class="card"><div class="seasonbar"><strong>الموسم النشط:</strong><select aria-label="الموسم النشط" onchange="setSeason(this.value)"><option value="winter"${sea==='winter'?' selected':''}>❄️ شتوي</option><option value="summer"${sea==='summer'?' selected':''}>☀️ صيفي</option></select><span class="hint">كل العمليات والمخزون والبحث محصورة بالموسم المحدد؛ يمكنك استخدام الكود نفسه في الموسم الآخر دون تداخل.</span></div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><form onsubmit="setRate(event)"><label>${ok?'سعر صرف اليوم':'أدخل سعر صرف اليوم'} (ل.س لكل $)${!ok&&r?' — آخر سعر: '+fmt(r):''}<input name="r" type="number" step="any" min="0" required value="${ok?r:''}"></label><button class="go">حفظ سعر اليوم</button></form></div>${lowBanner()}`};
const finds=c=>{c=(c||'').trim().toLowerCase();if(!c)return[];const base=db.products.filter(isActiveProduct);let x=base.filter(p=>(p.code||'').toLowerCase()===c);if(x.length)return x;x=base.filter(p=>p.name.toLowerCase()===c);if(x.length)return x;return base.filter(p=>p.name.toLowerCase().includes(c)||(p.code||'').toLowerCase().includes(c))};
const findP=c=>{const L=finds(c);return L.length===1?L[0]:null};
const pn2=p=>p?`${esc(p.name)} (${esc(p.code||'-')})${pyear(p)?' — سنة '+esc(pyear(p)):''}`:'(محذوف)';
const totUsd=(f,q)=>n(f.tot.value)>0?n(f.tot.value):q*n(f.usd.value);
const productCostCalc=f=>{if(!f||!f.usd||!f.qty||!f.tot)return;const total=Math.max(0,n(f.usd.value))*Math.max(0,Math.floor(n(f.qty.value)));f.tot.value=total.toFixed(2)};
const payUsd=(f,t)=>f.mode.value==='cash'?t:Math.max(0,t-Math.min(n(f.paid.value),t)); // paid field in purchase forms now means remaining supplier debt
function custData(){const C={};
 const inv=[...db.sales.filter(s=>s.cust&&s.qty*s.price-s.paid>0.005),...db.loans.map(l=>({id:l.id,date:l.date,ts:l.ts,cust:l.name,qty:1,price:l.amt,paid:0,loan:true,note:l.note}))];
 inv.forEach(s=>{(C[s.cust]=C[s.cust]||{inv:[],pool:0}).inv.push(s)});
 db.pay.forEach(p=>{if(C[p.cust])C[p.cust].pool+=p.amt});db.returns.forEach(r=>{if(r.cust&&C[r.cust])C[r.cust].pool+=r.value-r.refund});
 Object.values(C).forEach(c=>{let pool=c.pool;c.inv=c.inv.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).map(s=>{const owe=s.qty*s.price-s.paid,t=Math.min(owe,Math.max(pool,0));pool-=t;return{s,owe,rem:owe-t}});c.rem=c.inv.reduce((a,i)=>a+i.rem,0)});return C}
const pinfo=c=>{if(!(c||'').trim())return '';const L=finds(c);return !L.length?'لا يوجد منتج مطابق':L.length===1?`✓ ${pname(L[0])} | المتوفر: ${L[0].qty}`:'عدة منتجات، اكتب الكود: '+L.slice(0,6).map(p=>`${esc(p.code||'-')} (${pname(p)})`).join('، ')};
const supOpts=v=>'<option value="">بدون مورد</option>'+db.suppliers.map(s=>`<option value="${s.id}"${s.id===v?' selected':''}>${esc(s.name)}</option>`).join('');
const supName=id=>{const s=db.suppliers.find(x=>x.id===id);return s?esc(s.name):'-'};
const supDebt=id=>db.purchases.filter(p=>p.sid===id).reduce((a,p)=>a+p.qty*p.costUsd-p.paid,0)-db.spay.filter(p=>p.sid===id).reduce((a,p)=>a+p.amt,0);
const left=s=>s.qty-db.returns.filter(r=>r.saleId===s.id).reduce((a,r)=>a+r.qty,0);
const saleOf=id=>db.sales.find(s=>s.id===id);
const sopts=(c,cu)=>{const p=findP(c),k=(cu||'').trim().toLowerCase();return db.sales.filter(s=>left(s)>0&&isActiveProduct(prod(s.pid))&&(!p||s.pid===p.id)&&(!k||(s.cust||'').toLowerCase().includes(k))).slice(-60).reverse().map(s=>`<option value="${s.id}">${s.date} | ${pn2(prod(s.pid))} | ${esc(s.cust||'نقدي')} | متبقي ${left(s)} | ${fmt(s.price)}</option>`).join('')};
function summ(S,R,E){const g=S.reduce((a,s)=>a+s.qty*s.price,0),rv=R.reduce((a,r)=>a+r.value,0),c=S.reduce((a,s)=>a+s.qty*s.cost,0)-R.filter(r=>!r.damaged).reduce((a,r)=>a+r.qty*r.cost,0),ex=E.filter(e=>!e.wd).reduce((a,e)=>a+e.amt,0),wd=E.filter(e=>e.wd).reduce((a,e)=>a+e.amt,0),net=g-rv,pr=net-c;return{cnt:S.filter(s=>!s.swap).length,net,rv,c,pr,ex,wd,fin:pr-ex,aft:pr-ex-wd}}
const kpi=(o,extra='')=>`<div class="kpi"><div><span>عدد الفواتير</span><b>${o.cnt}</b></div><div><span>المبيعات (بعد المرتجع)</span><b>${dual(o.net)}</b></div><div><span>المرتجعات</span><b>${dual(o.rv)}</b></div><div><span>تكلفة البضاعة</span><b>${dual(o.c)}</b></div><div><span>مجمل الربح</span><b>${dual(o.pr)}</b></div><div><span>المصاريف</span><b>${dual(o.ex)}</b></div><div><span>صافي الربح</span><b class="${o.fin<0?'low':''}">${dual(o.fin)}</b></div><div><span>المسحوبات من الأرباح</span><b>${dual(o.wd)}</b></div><div class="net"><span>الربح بعد السحب</span><b class="${o.aft<0?'low':''}">${dual(o.aft)}</b></div>${extra}</div>`;
const tog=(a,b,cur,fa,fb)=>`<button class="${cur===a[0]?'go':'sm'}" onclick="${fa}('${a[0]}')">${a[1]}</button> <button class="${cur===b[0]?'go':'sm'}" onclick="${fa}('${b[0]}')">${b[1]}</button>`;

const credBal=c=>db.credits.filter(x=>x.cust===c).reduce((a,x)=>a+(x.kind==='add'?x.amt:-x.amt),0);
const credCard=()=>{const m={};db.credits.forEach(x=>{m[x.cust]=(m[x.cust]||0)+(x.kind==='add'?x.amt:-x.amt)});const rows=Object.entries(m).filter(([,v])=>v>0.005).map(([c,v])=>`<tr><td>${esc(c)}</td><td>${fmt(v)}</td></tr>`);return `<div class="card"><h3>أرصدة الزبائن (لهم عندي)</h3>${table(['الزبونة','الرصيد'],rows,'لا توجد أرصدة.')}</div>`};
const rsResults=()=>{const q=rsQ.trim().toLowerCase();if(!q&&!rsD)return '<p class="empty">اكتب كود المنتج أو اسمه، أو اسم الزبونة أو رقم الفاتورة أو اختر تاريخاً لعرض الفواتير المطابقة.</p>';let L=db.sales.filter(s=>left(s)>0&&isActiveProduct(prod(s.pid)));
 if(rsD)L=L.filter(s=>s.date===rsD);
 if(q)L=L.filter(s=>{const p=prod(s.pid)||{};return [String(s.no||''),s.cust||'',s.phone||'',p.name||'',p.code||'',s.date].some(v=>String(v).toLowerCase().includes(q))});
 return table(['رقم / تاريخ','الزبونة','المنتج','السعر','اشترت','أُرجع',''],L.slice(-15).reverse().map(s=>{const p=prod(s.pid)||{};return `<tr><td>${s.no?'#'+s.no+' ':''}${s.date}</td><td>${esc(s.cust||'نقدي')}${s.phone?' '+esc(s.phone):''}</td><td>${esc(p.name)} (${esc(p.code||'-')})${pyear(p)?' — سنة '+esc(pyear(p)):''}</td><td>${fmt(s.price)}</td><td>${s.qty}</td><td>${s.qty-left(s)}</td><td><button class="sm" onclick="pickInv('${s.id}')">اختيار</button></td></tr>`}),'لا توجد فواتير مطابقة.')};
const varOpts=()=>{const a=selInv?saleOf(selInv):null,p=a&&prod(a.pid);if(!p)return'';return '<option value="">—</option>'+db.products.filter(x=>isActiveProduct(x)&&x.id!==p.id&&x.name.toLowerCase()===p.name.toLowerCase()&&x.qty>0).map(x=>`<option value="${esc(x.code||x.name)}">${esc(x.name)}${pyear(x)?' — سنة '+esc(pyear(x)):''} (المتوفر ${x.qty})</option>`).join('')};
const rateAt=d=>{const r=db.rates.filter(x=>x.date<=d).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();return r?n(r.rate):curRate()};
const pcAt=(p,d)=>p.costUsd?p.costUsd*rateAt(d):n(p.cost);
const getLow=()=>{try{const v=localStorage.getItem('low');return v===null?2:n(v)}catch(e){return 2}};
const lowBanner=()=>{const k=db.products.filter(p=>isActiveProduct(p)&&p.qty<=getLow()).length;return k?`<div class="card"><b class="low">⚠ منتجات ناقصة: ${k}</b> <button class="sm" onclick="goLow()">عرض</button></div>`:''};
const cashOf=d=>{const S=db.sales.filter(s=>s.date===d),R=db.returns.filter(r=>r.date===d),E=db.expenses.filter(e=>e.date===d);
 const sales=S.reduce((a,s)=>a+s.paid-(s.cu||0),0),pay=db.pay.filter(p=>p.date===d).reduce((a,p)=>a+p.amt,0),ref=R.reduce((a,r)=>a+(r.swap?r.value-(r.credited||0):r.refund),0),ex=E.filter(e=>!e.wd).reduce((a,e)=>a+e.amt,0),wd=E.filter(e=>e.wd).reduce((a,e)=>a+e.amt,0),loan=db.loans.filter(l=>l.date===d).reduce((a,l)=>a+l.amt,0),cap=db.capital.filter(c=>c.date===d).reduce((a,c)=>a+c.amt,0);
 return{sales,pay,ref,ex,wd,loan,cap,net:sales+pay+cap-ref-ex-wd-loan}};
const lastClose=d=>db.closes.filter(c=>c.date<d).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).pop();
const closeOf=d=>db.closes.filter(c=>c.date===d).sort((a,b)=>(a.ts||0)-(b.ts||0)).pop();
const slogHtml=()=>{const d=saleD||today();
 const pairs=new Map();db.returns.filter(r=>r.swap).forEach(r=>{const sb=db.sales.find(x=>x.swap&&(r.wid?x.wid===r.wid:Math.abs((x.ts||0)-(r.ts||0))<1000));if(sb)pairs.set(sb.id,r)});
 const L=[...db.sales.filter(s=>s.date===d&&isActiveProduct(prod(s.pid))).map(s=>({t:s.ts||0,s})),...db.pay.filter(p=>p.date===d).map(p=>({t:p.ts||0,p}))].sort((a,b)=>a.t-b.t).reverse();
 const rows=L.map(x=>{if(x.p)return `<tr><td>سداد دين</td><td>-</td><td>${fmt(x.p.amt)}</td><td>-</td><td>${esc(x.p.cust)}</td><td>${fmt(x.p.amt)}</td><td></td></tr>`;
  const s=x.s,r=pairs.get(s.id);
  if(r){const df=s.qty*s.price-r.value,net=s.paid-(r.value-(r.credited||0));return `<tr><td>تبديل${s.no?' #'+s.no:''}<br>الأصلية: ${pn2(prod(r.pid))}<br>البديلة: ${pn2(prod(s.pid))}</td><td>${r.qty} ← ${s.qty}</td><td class="${df<0?'low':''}">${df>0.005?'زيادة '+fmt(df):df<-0.005?'نقصان '+fmt(-df):'بدون فرق'}</td><td>-</td><td>${esc(s.cust)}</td><td>${fmt(net)}</td><td><button class="sm" onclick="delRet('${r.id}')">إلغاء</button></td></tr>`}

delE(id){if(!confirm('حذف هذا المصروف؟'))return;const b=writeBatch(fs);b.delete(D('expenses',id));b.commit()},
payD(c){const d=custData()[c];if(!d)return;const v=n(prompt('مبلغ الدفعة من '+c+' (المتبقي '+fmt(d.rem)+')'));if(v<=0)return;if(v>d.rem+0.005)return toast('المبلغ أكبر من المتبقي');const b=writeBatch(fs);put(b,'pay',{date:today(),cust:c,amt:v});b.commit();toast('تم تسجيل الدفعة')},
addLoan(e){e.preventDefault();const f=e.target.elements,b=writeBatch(fs);put(b,'loans',{date:today(),name:f.name.value.trim(),amt:n(f.amt.value),note:f.note.value.trim()});b.commit().catch(fail);toast('تم تسجيل الدين');e.target.reset()},
importJ(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){return toast('ملف غير صالح')}
 const items=[];NAMES.forEach(k=>(d[k]||[]).forEach(x=>{if(x&&x.id)items.push([k,x])}));
 if(!items.length)return toast('لا توجد بيانات في الملف');
 if(!confirm('استيراد '+items.length+' سجل؟ السجلات المتطابقة ستُستبدل.'))return;
 for(let i=0;i<items.length;i+=400){const b=writeBatch(fs);items.slice(i,i+400).forEach(([k,x])=>{const {id,...r}=x;b.set(D(k,id),r)});b.commit().catch(fail)}
 toast('بدأ الاستيراد: '+items.length+' سجل');inp.value=''})},
exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='backup-'+today()+'.json';a.click()}
};
Object.assign(window,act);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
