<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#243b5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>محاسبة متجر الألبسة</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1c2733;--mute:#6b7785;--main:#243b5a;--acc:#e8c547;--line:#d9dfe7;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#141b24;--card:#1e2833;--ink:#e8edf2;--mute:#93a0ad;--main:#7fa6d6;--line:#33414f;--bad:#e8776d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:var(--main);color:#fff;padding:14px 16px;font-size:20px;font-weight:700}
@media (prefers-color-scheme:dark){header,button.go{color:#141b24!important}}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
nav button{flex:1;min-width:84px;padding:12px 8px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--main);border-color:var(--acc);font-weight:700}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
button.go{background:var(--main);color:#fff;border:0;border-radius:6px;padding:10px;font:inherit;font-weight:700;cursor:pointer;align-self:end}
button.sm{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
.low{color:var(--bad);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;color:var(--mute)}
.net{border-right:5px solid var(--acc)!important}
.empty{color:var(--mute);padding:8px 0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:9}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<header>محاسبة متجر الألبسة</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="msg" role="status"></div>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp(firebaseConfig);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const auth=getAuth(app);
const NAMES=['products','sales','purchases','expenses','pay','returns'];
let uid=null,unsubs=[],loaded=false,tab='products',tab_m='',tab_d='';
let db={products:[],sales:[],purchases:[],expenses:[],pay:[],returns:[]};
const C=k=>collection(fs,'stores',uid,k);
const D=(k,id)=>doc(fs,'stores',uid,k,id);
const put=(b,k,o)=>b.set(doc(C(k)),{...o,ts:Date.now()});
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2500)}
const prod=id=>db.products.find(p=>p.id===id);
const pname=p=>p?`${esc(p.name)} - ${esc(p.size)} - ${esc(p.color)}`:'(محذوف)';
const popts=()=>db.products.map(p=>`<option value="${p.id}">${pname(p)} (${p.qty})</option>`).join('');
const tabs={products:'المنتجات',sale:'بيع',buy:'شراء',ret:'مرتجع',swap:'تبديل',day:'يومي',rep:'شهري',exp:'المصاريف',debt:'الديون',acct:'الحساب'};
function table(h,rows,empty){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty">${empty}</div>`}

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];loaded=false;
  if(u){uid=u.uid;let got=0;
    NAMES.forEach(k=>unsubs.push(onSnapshot(C(k),s=>{
      db[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));
      if(++got>=NAMES.length)loaded=true;
      if(loaded)render()
    },e=>toast('خطأ في القراءة: '+e.code))));
  }else{uid=null;db={products:[],sales:[],purchases:[],expenses:[],pay:[],returns:[]}}
  render();
});

function render(){
  $('#nav').innerHTML=uid?Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join(''):'';
  if(!uid)return $('#app').innerHTML=views.login();
  if(!loaded)return $('#app').innerHTML='<div class="card empty">جارٍ تحميل البيانات...</div>';
  $('#app').innerHTML=views[tab]();
}

const rateGet=()=>{try{return localStorage.getItem('rate')||''}catch(e){return ''}};
const costF=(u,s)=>`<label>سعر الصرف (ل.س لكل $)<input name="rate" type="number" step="any" min="0" value="${rateGet()}" oninput="calc(this.form)"></label><label>سعر الشراء بالدولار $<input name="usd" type="number" step="any" min="0" value="${u}" oninput="calc(this.form)"></label><label>سعر الشراء بالسوري<input name="cost" type="number" step="any" min="0" required value="${s}"></label>`;
const left=s=>s.qty-db.returns.filter(r=>r.saleId===s.id).reduce((a,r)=>a+r.qty,0);
const sopts=()=>db.sales.filter(s=>left(s)>0).slice(-60).reverse().map(s=>`<option value="${s.id}">${s.date} | ${pname(prod(s.pid))} | متبقي ${left(s)} | ${fmt(s.price)}</option>`).join('');
const saleOf=id=>db.sales.find(s=>s.id===id);
function summ(S,R,E){const g=S.reduce((a,s)=>a+s.qty*s.price,0),rv=R.reduce((a,r)=>a+r.value,0),c=S.reduce((a,s)=>a+s.qty*s.cost,0)-R.reduce((a,r)=>a+r.qty*r.cost,0),ex=E.reduce((a,e)=>a+e.amt,0),net=g-rv,pr=net-c;return{cnt:S.filter(s=>!s.swap).length,net,rv,c,pr,ex,fin:pr-ex}}
const kpi=(o,extra='')=>`<div class="kpi"><div><span>عدد الفواتير</span><b>${o.cnt}</b></div><div><span>المبيعات (بعد المرتجع)</span><b>${fmt(o.net)}</b></div><div><span>المرتجعات</span><b>${fmt(o.rv)}</b></div><div><span>تكلفة البضاعة</span><b>${fmt(o.c)}</b></div><div><span>مجمل الربح</span><b>${fmt(o.pr)}</b></div><div><span>المصاريف</span><b>${fmt(o.ex)}</b></div><div class="net"><span>صافي الربح</span><b class="${o.fin<0?'low':''}">${fmt(o.fin)}</b></div>${extra}</div>`;

const views={
login(){return `<div class="card"><h3>تسجيل الدخول</h3><form onsubmit="login(event)"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="username"></label><label>كلمة المرور<input name="pw" type="password" required autocomplete="current-password"></label><button class="go">دخول</button></form></div>`},
products(){
 const rows=db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td>${p.costUsd?fmt(p.costUsd)+' $':'-'}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td class="${p.qty<=2?'low':''}">${p.qty}</td><td><button class="sm" onclick="delP('${p.id}')">حذف</button></td></tr>`);
 return `<div class="card"><h3>إضافة منتج</h3><form onsubmit="addP(event)">
 <label>الاسم<input name="name" required></label><label>المقاس<input name="size"></label><label>اللون<input name="color"></label>
 ${costF('','')}<label>سعر البيع بالسوري<input name="price" type="number" step="any" min="0" required></label>
 <label>الكمية الحالية<input name="qty" type="number" min="0" value="0"></label><button class="go">إضافة المنتج</button></form></div>
 <div class="card"><h3>المخزون (${db.products.length})</h3>${table(['الاسم','المقاس','اللون','شراء $','شراء ل.س','البيع','الكمية',''],rows,'لا توجد منتجات بعد. أضف أول منتج من النموذج أعلاه.')}</div>`},
sale(){
 const rows=db.sales.slice(-30).reverse().map(s=>{const dc=s.list>s.price?(s.list-s.price)*s.qty:0;return `<tr><td>${s.date}</td><td>${pname(prod(s.pid))}${s.swap?' (تبديل)':''}</td><td>${s.qty}</td><td>${fmt(s.qty*s.price)}</td><td>${dc?fmt(dc):'-'}</td><td>${esc(s.cust)}</td><td>${fmt(s.paid)}</td></tr>`});
 return `<div class="card"><h3>فاتورة بيع</h3>${db.products.length?`<form onsubmit="addS(event)">
 <label>المنتج<select name="pid" onchange="this.form.price.value=prod(this.value).price">${popts()}</select></label>
 <label>الكمية<input name="qty" type="number" min="1" value="1" required></label>
 <label>سعر القطعة (غيّره للخصم)<input name="price" type="number" step="any" min="0" value="${db.products[0].price}" required></label>
 <label>الزبون (للدين فقط)<input name="cust"></label>
 <label>المدفوع (للدين فقط، فارغ = كامل)<input name="paid" type="number" step="any" min="0"></label><button class="go">تسجيل البيع</button></form>
 <p class="empty">الخصم: اكتب سعر القطعة الجديد، والإجمالي يُحسب عليه ولا يُعتبر ديناً. الدين فقط إذا دفع الزبون أقل من الإجمالي.</p>`:'<div class="empty">أضف منتجات أولاً.</div>'}</div>
 <div class="card"><h3>آخر المبيعات</h3>${table(['التاريخ','المنتج','الكمية','الإجمالي','الخصم','الزبون','المدفوع'],rows,'لا توجد مبيعات بعد.')}</div>`},
buy(){
 const rows=db.purchases.slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td>${pname(prod(s.pid))}</td><td>${s.qty}</td><td>${s.costUsd?fmt(s.costUsd)+' $':'-'}</td><td>${fmt(s.cost)}</td><td>${fmt(s.qty*s.cost)}</td></tr>`);
 const p0=db.products[0]||{};
 return `<div class="card"><h3>فاتورة شراء</h3>${db.products.length?`<form onsubmit="addB(event)">
 <label>المنتج<select name="pid" onchange="const p=prod(this.value);this.form.cost.value=p.cost;this.form.usd.value=p.costUsd||''">${popts()}</select></label>
 <label>الكمية<input name="qty" type="number" min="1" value="1" required></label>
 ${costF(p0.costUsd||'',p0.cost??'')}<button class="go">تسجيل الشراء</button></form>`:'<div class="empty">أضف منتجات أولاً.</div>'}</div>
 <div class="card"><h3>آخر المشتريات</h3>${table(['التاريخ','المنتج','الكمية','سعر $','سعر ل.س','الإجمالي ل.س'],rows,'لا توجد مشتريات بعد.')}</div>`},
ret(){
 const rows=db.returns.filter(r=>!r.swap).slice(-30).reverse().map(r=>`<tr><td>${r.date}</td><td>${pname(prod(r.pid))}</td><td>${r.qty}</td><td>${fmt(r.value)}</td><td>${fmt(r.refund)}</td></tr>`);
 return `<div class="card"><h3>مرتجع</h3>${sopts()?`<form onsubmit="addR(event)"><label>الفاتورة الأصلية<select name="sid">${sopts()}</select></label>
 <label>كمية المرتجع<input name="qty" type="number" min="1" value="1" required></label>
 <label>المبلغ المردود للزبون (فارغ = كامل القيمة)<input name="refund" type="number" step="any" min="0"></label><button class="go">تسجيل المرتجع</button></form>
 <p class="empty">القطعة تعود للمخزون ويُخصم المرتجع من المبيعات والربح. إن كان على الزبون دين لم يسدده، اكتب 0 ليُخصم المرتجع من دينه.</p>`:'<div class="empty">لا توجد مبيعات قابلة للإرجاع.</div>'}</div>
 <div class="card"><h3>آخر المرتجعات</h3>${table(['التاريخ','المنتج','الكمية','القيمة','المردود'],rows,'لا توجد مرتجعات.')}</div>`},
swap(){
 return `<div class="card"><h3>تبديل منتج</h3>${sopts()&&db.products.length?`<form onsubmit="addW(event)" oninput="swCalc(this)"><label>المنتج المُرجَع (اختر فاتورته)<select name="sid">${sopts()}</select></label>
 <label>كمية المُرجَع<input name="rq" type="number" min="1" value="1" required></label>
 <label>المنتج الجديد<select name="pid" onchange="this.form.price.value=prod(this.value).price">${popts()}</select></label>
 <label>كمية الجديد<input name="qty" type="number" min="1" value="1" required></label>
 <label>سعر القطعة الجديدة<input name="price" type="number" step="any" min="0" value="${db.products[0].price}" required></label><button class="go">تسجيل التبديل</button></form>
 <p id="diff" class="empty">الفرق: -</p>`:'<div class="empty">تحتاج فاتورة بيع سابقة ومنتجات.</div>'}</div>`},
exp(){
 const rows=db.expenses.slice(-30).reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.desc)}</td><td>${fmt(e.amt)}</td><td><button class="sm" onclick="delE('${e.id}')">حذف</button></td></tr>`);
 return `<div class="card"><h3>تسجيل مصروف</h3><form onsubmit="addE(event)">
 <label>البند (إيجار، كهرباء، راتب...)<input name="desc" required></label><label>المبلغ<input name="amt" type="number" step="any" min="0" required></label><label>التاريخ<input name="date" type="date" value="${today()}"></label><button class="go">حفظ المصروف</button></form></div>
 <div class="card"><h3>آخر المصاريف</h3>${table(['التاريخ','البند','المبلغ',''],rows,'لا توجد مصاريف بعد.')}</div>`},
debt(){
 const b={};db.sales.forEach(s=>{if(s.cust)b[s.cust]=(b[s.cust]||0)+s.qty*s.price-s.paid});
 db.pay.forEach(p=>{b[p.cust]=(b[p.cust]||0)-p.amt});
 db.returns.forEach(r=>{if(r.cust)b[r.cust]=(b[r.cust]||0)-(r.value-r.refund)});
 const rows=Object.entries(b).filter(([,v])=>v>0.005).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="low">${fmt(v)}</td><td><button class="sm" onclick="payD(${JSON.stringify(c).replace(/"/g,'&quot;')})">تسجيل دفعة</button></td></tr>`);
 return `<div class="card"><h3>ذمم الزبائن</h3>${table(['الزبون','المتبقي',''],rows,'لا توجد ديون. عند البيع اكتب اسم الزبون وأدخل مبلغاً أقل من الإجمالي لتسجيل دين.')}</div>`},
day(){
 const d=tab_d||today(),S=db.sales.filter(s=>s.date===d),R=db.returns.filter(r=>r.date===d),E=db.expenses.filter(e=>e.date===d);
 const L=[...S.map(s=>[s.swap?'تبديل (جديد)':'بيع',pname(prod(s.pid)),s.qty,s.qty*s.price]),...R.map(r=>[r.swap?'تبديل (مُرجَع)':'مرتجع',pname(prod(r.pid)),r.qty,-r.value])];
 const rows=L.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td><td class="${l[3]<0?'low':''}">${fmt(l[3])}</td></tr>`);
 return `<div class="card"><h3>تقرير يومي</h3><label style="max-width:200px">اليوم<input type="date" value="${d}" onchange="setD(this.value)"></label></div>${kpi(summ(S,R,E))}<div class="card" style="margin-top:14px"><h3>تفاصيل اليوم</h3>${table(['النوع','المنتج','الكمية','القيمة'],rows,'لا توجد حركات في هذا اليوم.')}</div>`},
rep(){
 const m=tab_m||today().slice(0,7),stock=db.products.reduce((a,p)=>a+p.qty*p.cost,0);
 const o=summ(db.sales.filter(s=>s.date.startsWith(m)),db.returns.filter(r=>r.date.startsWith(m)),db.expenses.filter(e=>e.date.startsWith(m)));
 return `<div class="card"><h3>تقرير شهري</h3><label style="max-width:200px">الشهر<input type="month" value="${m}" onchange="setM(this.value)"></label></div>${kpi(o,`<div><span>قيمة المخزون (بسعر الشراء)</span><b>${fmt(stock)}</b></div>`)}`},
acct(){return `<div class="card"><h3>الحساب</h3><p>البيانات تُحفظ في Firebase وتعمل أيضاً بدون إنترنت، وتُزامَن تلقائياً عند عودة الاتصال. كل المبالغ بالليرة السورية ما لم يُذكر الدولار.</p><button class="go" onclick="exportJ()">تصدير نسخة احتياطية (ملف)</button> <button class="sm" onclick="out()">تسجيل الخروج</button></div>`}
};

const fail=x=>toast('تعذّر الحفظ: '+x.code);
const act={
go(k){tab=k;render()},
setM(v){tab_m=v;render()},
setD(v){tab_d=v;render()},
prod,
calc(f){const r=n(f.rate.value),u=n(f.usd.value);try{if(r)localStorage.setItem('rate',r)}catch(e){}if(r&&u)f.cost.value=Math.round(u*r)},
swCalc(f){const a=saleOf(f.sid.value);if(!a)return;const d=n(f.qty.value)*n(f.price.value)-n(f.rq.value)*a.price;$('#diff').textContent=d>0?'يدفع الزبون: '+fmt(d):d<0?'تردّ للزبون: '+fmt(-d):'لا يوجد فرق'},
login(e){e.preventDefault();const f=e.target.elements;signInWithEmailAndPassword(auth,f.email.value.trim(),f.pw.value).catch(()=>toast('بيانات الدخول غير صحيحة أو لا يوجد اتصال'))},
out(){signOut(auth)},
addP(e){e.preventDefault();const f=e.target.elements,b=writeBatch(fs);
 put(b,'products',{name:f.name.value.trim(),size:f.size.value.trim(),color:f.color.value.trim(),costUsd:n(f.usd.value),cost:n(f.cost.value),price:n(f.price.value),qty:Math.floor(n(f.qty.value))});
 b.commit().catch(fail);toast('تمت إضافة المنتج')},
delP(id){const p=prod(id);if(!confirm('حذف '+p.name+'؟'))return;const b=writeBatch(fs);b.delete(D('products',id));b.commit()},
addS(e){e.preventDefault();const f=e.target.elements,p=prod(f.pid.value),q=Math.floor(n(f.qty.value)),pr=n(f.price.value),tot=q*pr,cust=f.cust.value.trim();
 if(q>p.qty)return toast('الكمية المتوفرة '+p.qty+' فقط');
 let paid=f.paid.value===''?tot:n(f.paid.value);
 if(paid<tot&&!cust)return toast('اكتب اسم الزبون لتسجيل الدين');
 if(paid>tot)paid=tot;
 const b=writeBatch(fs);
 b.update(D('products',p.id),{qty:increment(-q)});
 put(b,'sales',{date:today(),pid:p.id,qty:q,price:pr,list:p.price,cost:p.cost,cust,paid});
 b.commit().catch(fail);toast('تم البيع: '+fmt(tot))},
addR(e){e.preventDefault();const f=e.target.elements,s=saleOf(f.sid.value),q=Math.floor(n(f.qty.value));
 if(!prod(s.pid))return toast('المنتج محذوف');
 if(q<1||q>left(s))return toast('المتبقي للإرجاع '+left(s));
 const val=q*s.price,rf=f.refund.value===''?val:n(f.refund.value);
 if(rf>val)return toast('المبلغ المردود أكبر من قيمة المرتجع');
 const b=writeBatch(fs);
